<title>PROTOTYPE — 10 review and promotion</title>
<!--
  THROWAWAY PROTOTYPE for .tickets/nmea-ingestion/issues/10-review-and-promotion-screen.md
  Three variants of the after-the-race review and promotion surface, switchable
  via ?variant=A|B|C, the floating bar at the bottom, and the arrow keys. Not
  app code. Do not port any of this HTML/CSS — only the decision it settles.

  They disagree about what the PRIMARY OBJECT is, not about styling:
    A "The Tape"  — time. Scrub an instrument timeline, select a stretch,
                    promote it. Proposals are an overlay.
    B "The Inbox" — proposals. No timeline at all: a queue of candidate points
                    you accept or skip, the way you cull photos.
    C "The Polar" — the polar table. Your existing curve with this race's
                    measured cloud laid over it; you work on bins, and time is
                    derived from the bin you tap.

  THE DATA IS A REAL RACE. `node nmea-sim.js generate --duration 7200` sailing
  polars/fleet.js, reduced through ticket 05's row shape for real —
  anchor-triggered on MWV,T/VHW, 250 ms coalesce, 750 ms floor, TTL-null
  staleness — giving 7,035 rows from 7,200 seconds. Proposals below are the
  actual 118 that rule produces. Series/cloud/track are decimated for drawing
  only; every number is measured, not invented.

  TWO THINGS ARE SYNTHETIC, deliberately:
    1. The faults. nmea-sim arms its fault timeline PER CONNECTION, so
       `generate` (headless, no socket) can only ever emit a clean log — the
       faults in the script never fire. The stale-VHW run, the two connection
       holes and the status-V wind run are punched into the parsed rows
       afterwards, so this screen has the holes it exists to show.
    2. The sail assertions are wrong in the three ways a human on a wet
       foredeck gets them wrong: first hoist 95 s late, one peel tapped 70 s
       early, the A5 hoist missed entirely. Question 3 has no teeth against
       tidy data.

  PROPOSALS ARE A STAND-IN FOR TICKET 07, which is still open: steady = heading
  within +/-8 deg and TWS within +/-1.5 kn held 30 s; bins 1 kn x 4 deg; median;
  min 8 samples. When 07 lands, its rule replaces this one. Nothing here is a
  recommendation about the statistic.

  The harness bar forces the states you cannot get by waiting: the assertions
  fixed or as-recorded, the three session-list states, and day/night.
-->

const fmt = sec => {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
};
const mins = sec => sec < 60 ? `${Math.round(sec)}s` : `${Math.floor(sec/60)}m ${Math.round(sec)%60}s`;
const lin = (d0,d1,r0,r1) => v => r0 + ((v-d0)/((d1-d0)||1))*(r1-r0);
const median = xs => { const s=[...xs].sort((a,b)=>a-b), m=s.length>>1;
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
const pctl = (xs,p) => { const s=[...xs].sort((a,b)=>a-b);
  return s[Math.min(s.length-1, Math.floor(p*s.length))]; };

/* series rows are [t, stw, tws, twa, hdg] — a path that BREAKS on nulls and on
   time discontinuities, because ticket 05 §5 forbids interpolating across a
   gap and drawing one is the same lie */
function seriesPath(idx, x, y, from = 0, to = DUR){
  const win = DATA.series.filter(r => r[0] >= from && r[0] <= to);
  // The data is kept at full 1 Hz — stats and selections read it all — but the
  // PATH is capped at ~2 points per pixel. A phone cannot resolve more, and
  // emitting 7,035 path commands on every drag frame makes the scrub feel
  // laggy, which would damn variant A's interaction for the wrong reason.
  const stride = Math.max(1, Math.floor(win.length / (W*2)));
  let d = '', pen = false, prevT = null;
  for (let i = 0; i < win.length; i += stride){
    const r = win[i], v = r[idx];
    const broke = prevT !== null && r[0]-prevT > Math.max(5, stride*3);
    if (v === null || broke) pen = false;
    else { d += `${pen?'L':'M'}${x(r[0]).toFixed(1)} ${y(v).toFixed(1)} `; pen = true; }
    prevT = r[0];
  }
  return d;
}

}

const inWin = (r,f,t) => r[1] >= f && r[0] <= t;

/* stats for a hand-selected stretch — the manual path */
function stretchStats(from, to){
  to = Math.max(to, from + 1);   // a zero-length selection is one sample, not none
  const win = DATA.series.filter(r => r[0] >= from && r[0] <= to);
  const sp = win.map(r=>r[1]).filter(v=>v!==null);
  const tw = win.map(r=>r[2]).filter(v=>v!==null);
  const ta = win.map(r=>r[3]).filter(v=>v!==null);
  if (!sp.length || !tw.length || !ta.length) return { empty:true };
  const steadySec = DATA.steady.reduce((a,r) =>
    a + Math.max(0, Math.min(to,r[1]) - Math.max(from,r[0])), 0);
  return {
    empty:false,
    speed: median(sp), lo: pctl(sp,.1), hi: pctl(sp,.9),
    tws: median(tw), twa: Math.round(median(ta.map(Math.abs))),
    tack: median(ta) >= 0 ? 'starboard' : 'port',
    steadyPct: Math.round(100*steadySec/Math.max(1,to-from)),
    nulls: win.length - sp.length,
  };
}

/* ============================================================

function renderB(){

      <div class="xs muted" style="margin:4px 0 8px">Nothing before ${fmt(first)} can become a polar point.

      <div class="row" style="flex-wrap:wrap;gap:5px">
        ${ALL_SAILS.map(s => `<button class="chip" data-act="fixStart" data-sail="${s}"

    <div class="card" style="margin-bottom:8px">

function card(p){

             <line x1="${bx(p.sp[0])}" y1="13" x2="${bx(p.sp[1])}" y2="13" stroke="var(--line)" stroke-width="6"/>

      <button class="btn primary sm grow" data-act="accept" data-id="${p.id}">Accept</button>
    </div>
    ${open ? evidence(p) : ''}
  </div>`;
}

/* the stretch a point came from — a sparkline, not a timeline */
function evidence(p){
  const w = 300, h = 60;
  const a = Math.max(0, p.st[0][0]-40), b = Math.min(DUR, p.st[0][1]+40);
  const x = lin(a, b, 0, w), y = lin(0, 16, h-4, 4);
  return `<div style="margin-top:10px">
    <svg width="${w}" height="${h}">
      <rect x="0" y="0" width="${w}" height="${h}" rx="4" fill="var(--panel2)"/>
      ${p.st.filter(s => s[1]>=a && s[0]<=b).map(s =>
        `<rect x="${x(s[0])}" y="0" width="${Math.max(1.5,x(s[1])-x(s[0]))}" height="${h}" fill="rgba(34,197,94,.22)"/>`).join('')}
      <path d="${seriesPath(1, x, y, a, b)}" stroke="var(--fg)" stroke-width="1.3" fill="none"/>
      <line x1="0" y1="${y(p.speed)}" x2="${w}" y2="${y(p.speed)}" stroke="var(--accent)" stroke-dasharray="3 3"/>
    </svg>

      ${fmt(p.st[0][0])}–${fmt(p.st[0][1])} · median ${p.speed.toFixed(2)} kn (dashed) ·
      p10–p90 ${p.sp[0].toFixed(1)}–${p.sp[1].toFixed(1)} ·
      ${p.stbd&&p.port?`both tacks (${p.stbd}/${p.port})`:p.stbd?'starboard':'port'}
    </div>
    <div class="xs" style="color:var(--warn);margin-top:4px">
      Only the first of ${p.st.length} stretches is shown. The other ${p.st.length-1} are

  </div>`;
}

/* ============================================================
   VARIANT C — "The Polar". Primary object: THE POLAR TABLE.
   The bet: promotion is a judgement about a polar, so the polar should be on
   screen while you make it. This is the only variant that shows imported and
   captured as two separate things — which ticket 03 says they must stay.
   ============================================================ */
const PS = 320, PCX = 26, PCY = PS/2, PR = PS-72, PMAX = 16;
const polarXY = (twa, sp) => {
  const a = (twa-90)*Math.PI/180, r = (sp/PMAX)*PR;
  return [PCX + r*Math.cos(a), PCY + r*Math.sin(a)];
};

function renderC(){
  const props = proposals();
  const sails = [...new Set(props.map(p=>p.sail))].sort();
  const sail = S.binSail && sails.includes(S.binSail) ? S.binSail : sails[0];
  const mine = props.filter(p => p.sail === sail && Math.abs(p.tws-S.binTws) <= 1);
  const ex = (DATA.existing[sail]||[]).filter(p => Math.abs(p.tws-S.binTws) <= 2);
  const si = DATA.sails.indexOf(sail);
  const cloud = DATA.cloud.filter(c => c[3] === si && Math.abs(c[2]-S.binTws) <= 1);
  const sel = mine.find(p => p.id === S.bin);
  const nAcc = Object.values(S.decisions).filter(v => v === 'accept').length;

  return `
  <div class="pad" style="padding-bottom:120px">
    <div class="xs" data-act="back" style="color:var(--accent)">‹ Sessions</div>
    <div class="lg" style="margin-top:6px">${sail} polar</div>
    <div class="xs muted">grey = your table · blue = this race</div>

    <div class="row" style="gap:5px;margin-top:10px;overflow-x:auto">
      ${sails.map(s => `<button class="chip ${s===sail?'on':''}" data-act="pickSail" data-sail="${s}"
        style="${s===sail?`background:${col(s)};color:#04121c`:''}">${s}</button>`).join('')}
    </div>
    <div class="row" style="gap:5px;margin-top:8px">
      <span class="xs muted">TWS</span>
      ${[8,10,12,14].map(t => `<button class="chip ${t===S.binTws?'on':''}" data-act="pickTws" data-tws="${t}">${t} kn</button>`).join('')}
    </div>

    <svg width="${PS}" height="${PS}" style="margin-top:10px">
      ${[4,8,12,16].map(s => {
        const r = (s/PMAX)*PR, a = polarXY(0,s), b = polarXY(180,s);
        return `<path d="M${a[0]} ${a[1]} A${r} ${r} 0 0 1 ${b[0]} ${b[1]}" stroke="var(--grid)" fill="none"/>
                <text x="${PCX+3}" y="${PCY-r+10}" font-size="8" fill="var(--dim)">${s}</text>`;
      }).join('')}
      ${[0,30,60,90,120,150,180].map(a => {
        const p = polarXY(a, PMAX);
        return `<line x1="${PCX}" y1="${PCY}" x2="${p[0]}" y2="${p[1]}" stroke="var(--grid)"/>
                <text x="${p[0]+3}" y="${p[1]}" font-size="8" fill="var(--dim)">${a}°</text>`;
      }).join('')}
      ${cloud.map(c => { const p = polarXY(c[0], c[1]);
        return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="1.4" fill="rgba(56,189,248,.30)"/>`; }).join('')}
      ${ex.map(p => { const q = polarXY(p.twa, p.speed);
        return `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.5" fill="var(--dim)"/>`; }).join('')}
      ${mine.map(p => {
        const q = polarXY(p.twa, p.speed);
        const on = S.decisions[p.id] === 'accept';
        const line = p.ex !== null ? (()=>{ const e = polarXY(p.twa, p.ex);
          return `<line x1="${q[0]}" y1="${q[1]}" x2="${e[0]}" y2="${e[1]}" stroke="rgba(56,189,248,.55)"/>`; })() : '';
        return line + `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${S.bin===p.id?9:6}"
          fill="${on?'var(--accent)':'rgba(56,189,248,.18)'}" stroke="var(--accent)"
          stroke-width="${S.bin===p.id?2.5:1.5}" style="cursor:pointer"
          data-act="pickBin" data-id="${p.id}"/>`;
      }).join('')}
    </svg>
    <div class="xs muted" style="margin-top:4px">Tap a ringed point. Filled = accepted.</div>

    ${sel ? `<div class="card" style="margin-top:12px">
      <div class="sm" style="font-weight:600">${sel.twa}° at ${sel.tws} kn</div>
      <div class="xs muted" style="margin:4px 0 8px">
        This race: <b style="color:var(--fg)">${sel.speed.toFixed(2)} kn</b> from ${sel.n} samples
        (p10–p90 ${sel.sp[0].toFixed(1)}–${sel.sp[1].toFixed(1)}) ·
        ${sel.ex===null ? 'your table has nothing here'
          : `your table says ${sel.ex.toFixed(2)} (<span class="delta ${sel.d>=0?'up':'down'}">${sel.d>0?'+':''}${sel.d}%</span>)`}
      </div>
      ${whereFrom(sel)}
      <div class="row" style="gap:6px;margin-top:10px">
        <button class="btn sm" data-act="clearBin">Close</button>
        <button class="btn ${S.decisions[sel.id]==='accept'?'':'primary'} sm grow" data-act="toggleBin" data-id="${sel.id}">
          ${S.decisions[sel.id]==='accept'?'Remove from polar':'Add to polar'}</button>
      </div>
    </div>` : `<div class="card" style="margin-top:12px">
      <div class="xs">${mine.length} bins measured at ${S.binTws} kn · ${nAcc} accepted</div>
      <div class="row" style="gap:6px;margin-top:8px">
        <button class="btn primary sm grow" data-act="acceptBand">Add all ${mine.length} to ${sail}</button>
        ${nAcc?`<button class="btn sm danger" data-act="undoAll">Undo session</button>`:''}
      </div>
    </div>`}

    ${track(sel)}

    <div class="xs muted" style="margin-top:10px">
      ${esc(DATA.session.name)} · wind reads ${DATA.session.wind} · ${DATA.session.stale.stw} rows without boat speed
    </div>
  </div>`;
}

function whereFrom(p){
  const w = 296, h = 20, x = lin(0, DUR, 0, w);
  return `<svg width="${w}" height="${h}">
    <rect x="0" y="7" width="${w}" height="6" rx="3" fill="var(--panel2)"/>
    ${p.st.map(s => `<rect x="${x(s[0])}" y="4" width="${Math.max(1.5,x(s[1])-x(s[0]))}" height="12" rx="2" fill="var(--accent)"/>`).join('')}
  </svg>
  <div class="xs muted">${p.st.length} stretches · ${p.st.slice(0,4).map(s=>fmt(s[0])).join(', ')}${p.st.length>4?'…':''}</div>`;
}

/* GPS track in local metres — no tiles, no API key. Enough to judge whether a
   track is a useful primary view at all. */
function track(sel){
  const w = 320, h = 190;
  const xs = DATA.track.map(p=>p[0]), ys = DATA.track.map(p=>p[1]);
  const span = Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys)) || 1;
  const x = lin(Math.min(...xs), Math.min(...xs)+span, 10, w-10);
  const y = lin(Math.min(...ys), Math.min(...ys)+span, h-10, 10);
  let d = '';
  DATA.track.forEach((p,i) => { d += `${i?'L':'M'}${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)} `; });
  const hi = sel ? DATA.track.filter(p => sel.st.some(s => p[2]>=s[0] && p[2]<=s[1])) : [];
  return `<div style="margin-top:14px">
    <div class="xs muted" style="text-transform:uppercase;letter-spacing:.06em">Track</div>
    <svg width="${w}" height="${h}" style="margin-top:4px">
      <rect x="0" y="0" width="${w}" height="${h}" rx="8" fill="var(--panel)"/>
      <path d="${d}" stroke="var(--dim)" stroke-width="1" fill="none"/>
      ${hi.map(p => `<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="2.4" fill="var(--accent)"/>`).join('')}
    </svg>
  </div>`;
}

/* ============================================================
   captions
   ============================================================ */
const CAPTIONS = {
  A: `<h3>A — The Tape</h3>
   <p><b>Primary object: time.</b> The session is an instrument tape you scrub,

     <li>Drag the blue window along the overview, then drag across the detail

     <li>Tap a sail block to move or delete it. <span class="q">Q3</span></li>
     <li>Open the proposal list and tap one — it jumps the window to that
         stretch. <span class="q">Q4, but note the caption below.</span></li>
   </ul>
   <h4>Where it's weak</h4>
   <ul>
     <li class="bad">A proposal is <b>not</b> one stretch. The median proposal is
       fed by <b>17 separate stretches</b>, most 1–3 s long. "Jump to it" is a
       lie this layout tells naturally.</li>
     <li>At the default whole-session zoom, 7,035 samples are 336 px wide — about
       <b>21 samples per pixel</b>. The line you see is drawn at 2 points/px
       because nothing finer is resolvable; zoom in and it fills back out.</li>
   </ul>`,
  B: `<h3>B — The Inbox</h3>
   <p><b>Primary object: proposals.</b> No timeline at all. Question 2 —
   "how do you scrub two hours on a phone?" — is answered <i>you don't</i>.
   Each card carries just enough evidence to decide without leaving.</p>
   <h4>What to try</h4>
   <ul>
     <li>Scroll. <span class="q">There are 118 cards from ONE Wednesday
       evening.</span> That is the variant's central problem, not a detail.</li>
     <li>Filter by sail with the chips, then "Accept all".
       <span class="q">Q4: is per-sail the right bulk unit?</span></li>
     <li>Open "Evidence" on a card — sparkline, median, p10–p90, tack split.</li>
     <li>The amber card at the top is <span class="q">Q3</span>: a bad assertion
       arrives as a <i>blocker</i>, because it stands between you and points.</li>
   </ul>
   <h4>Where it's weak</h4>
   <ul>
     <li class="bad">You never see the race. If a whole leg was sailed badly, or
       in someone's dirty air, nothing here tells you.</li>
     <li class="bad">The manual path (founding decision 7's required fallback) has
       nowhere natural to live — it's an empty-state link.</li>
   </ul>`,
  C: `<h3>C — The Polar</h3>
   <p><b>Primary object: the polar table.</b> Your existing curve with this
   race's cloud over it; you work on bins, and time is <i>derived</i> from the
   bin you tap. The only variant that shows imported and captured as two
   separate things — which <b>ticket 03</b> says they must stay.</p>
   <h4>What to try</h4>
   <ul>
     <li>Tap a ringed point: the blue line to the grey dot is the disagreement
       with your table. <span class="q">Q4</span></li>
     <li>Change sail and TWS band. <span class="q">Q2: navigating the polar
       instead of time.</span></li>
     <li>With a bin selected, look at the strip and the track — the same bin lights
       up in both. <span class="q">Q1: is a track a useful primary view?</span></li>
   </ul>
   <h4>Where it's weak</h4>
   <ul>
     <li class="bad">Sail × TWS band means <b>~24 screens</b> to see one race.</li>
     <li class="bad">A bin with no assertion simply doesn't appear — the missed A5
       hoist is invisible here. Compare with B, which shouts about it.</li>
     <li>No manual stretch selection at all yet.</li>
   </ul>`,
};

const COMMON_CAPTION = `
  <h4 style="margin-top:22px">The data</h4>
  <p>A real two-hour <span class="mono">nmea-sim</span> race sailing
  <span class="mono">polars/fleet.js</span>, reduced through <b>ticket 05</b>'s row
  shape: anchor-triggered on <span class="mono">MWV,T</span>/<span class="mono">VHW</span>,
  250 ms coalesce, TTL-null staleness — <b>7,035 rows from 7,200 s</b>. The 118
  proposals are the actual output of the <b>ticket 07 stand-in</b> rule.</p>
  <p>Synthetic and deliberate: the <b>faults</b> (nmea-sim arms them per socket
  connection, so <span class="mono">generate</span> can only emit a clean log) and
  the <b>sail assertions</b>, which are wrong in the three ways a human on a wet
  foredeck gets them wrong — first hoist 95 s late, one peel 70 s early, the A5
  hoist missed entirely.</p>
  <p>The harness's <b>assertions: fixed</b> corrects all three:
  <b>118 → 120 proposals</b>, and the A5 bins appear from nothing.</p>`;

/* ============================================================
   render + wiring
   ============================================================ */
function render(){
  const screen = $('screen');
  let html;
  if (S.view === 'list') html = renderList();
  else if (S.session !== 'live') html = renderDeadEnd(S.session);
  else html = S.variant === 'A' ? renderA() : S.variant === 'B' ? renderB() : renderC();
  screen.innerHTML = html;

  $('vlabel').textContent = `${S.variant} — ${VARIANTS[S.variant].name}`;
  $('caption').innerHTML = CAPTIONS[S.variant] + COMMON_CAPTION;
  const props = proposals();
  const acc = Object.values(S.decisions).filter(v=>v==='accept').length;
  $('counts').textContent =
    `${props.length} proposals · ${acc + S.promoted} promoted · primary object: ${VARIANTS[S.variant].object}`;

  wireDrag();
}

/* pointer drags: overview moves the window, detail selects a stretch */
function wireDrag(){
  const ov = $('ov'), det = $('det');
  if (ov) drag(ov, px => {
    const span = S.win[1]-S.win[0];
    const centre = (px/W)*DUR;
    const f = clamp(centre-span/2, 0, DUR-span);
    S.win = [f, f+span]; render();
  });
  if (det) {
    let anchor = null;
    drag(det, (px, phase) => {
      const t = clamp(S.win[0] + (px/W)*(S.win[1]-S.win[0]), S.win[0], S.win[1]);
      if (phase === 'start') anchor = t;
      S.sel = [Math.min(anchor,t), Math.max(anchor,t)];
      if (phase === 'end' && S.sel[1]-S.sel[0] < 3) S.sel = null;
      render();
    });
  }
}

function drag(el, cb){
  const at = e => {
    const r = el.getBoundingClientRect();
    return clamp((e.clientX ?? e.touches[0].clientX) - r.left, 0, W);
  };
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    cb(at(e), 'start');
    const move = ev => cb(at(ev), 'move');
    const up = ev => {
      cb(at(ev), 'end');
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
  });
}

/* ============================================================
   actions
   ============================================================ */
$('screen').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  const props = proposals();

  switch (a) {
    case 'open':   S.session = el.dataset.id === 's2' ? 'live' : el.dataset.id; S.view='session'; break;
    case 'back':   S.view='list'; S.sel=null; S.bin=null; break;

    /* A */
    case 'zoomIn':  case 'zoomOut': {
      const [f,t] = S.win, c = (f+t)/2;
      const span = clamp((t-f)*(a==='zoomIn'?0.5:2), 60, DUR);
      const nf = clamp(c-span/2, 0, DUR-span);
      S.win = [nf, nf+span]; break;
    }
    case 'zoomAll': S.win = [0, DUR]; break;
    case 'clearSel': S.sel = null; break;
    case 'promoteSel': S.promoted++; S.sel = null; break;
    case 'undoAll': S.promoted = 0; S.decisions = {}; break;
    case 'openProposals': S.showProposals = true; break;
    case 'closeProposals': S.showProposals = false; break;
    case 'acceptAllProps': S.promoted += props.length; S.showProposals = false; break;
    case 'gotoProposal': {
      const p = props.find(x => x.id === el.dataset.id);
      S.win = [Math.max(0,p.st[0][0]-120), Math.min(DUR,p.st[0][1]+120)];
      S.sel = [p.st[0][0], p.st[0][1]];
      S.showProposals = false; break;
    }
    case 'editAssert': S.editing = +el.dataset.i; break;
    case 'closeEditor': S.editing = null; break;
    case 'addAssert': case 'setSail': case 'nudge': case 'moveToSel': case 'delAssert':
      alert('Assertion edits are wired in the RN version; here the harness\'s ' +
            '"assertions: fixed" toggle is the honest way to see what correcting ' +
            'them does — it rebuilds all 118 proposals.');
      S.editing = null; break;

    /* B */
    case 'filter': S.binSail = el.dataset.sail || null; break;
    case 'accept': S.decisions[el.dataset.id] = 'accept'; break;
    case 'skip':   S.decisions[el.dataset.id] = 'skip'; break;
    case 'evidence': S.expanded = S.expanded === el.dataset.id ? null : el.dataset.id; break;
    case 'acceptAll': for (const p of props) if (!S.decisions[p.id] && (!S.binSail || p.sail===S.binSail)) S.decisions[p.id]='accept'; break;
    case 'skipAll':   for (const p of props) if (!S.decisions[p.id] && (!S.binSail || p.sail===S.binSail)) S.decisions[p.id]='skip'; break;
    case 'fixStart': S.assertMode = 'fixed'; syncHarness(); break;
    case 'manual': alert('The manual path is variant A. That this variant has to ' +
      'send you somewhere else for it IS the finding.'); break;

    /* C */
    case 'pickSail': S.binSail = el.dataset.sail; S.bin = null; break;
    case 'pickTws':  S.binTws = +el.dataset.tws; S.bin = null; break;
    case 'pickBin':  S.bin = el.dataset.id; break;
    case 'clearBin': S.bin = null; break;
    case 'toggleBin': {
      const id = el.dataset.id;
      if (S.decisions[id] === 'accept') delete S.decisions[id]; else S.decisions[id] = 'accept';
      break;
    }
    case 'acceptBand': {
      const sails = [...new Set(props.map(p=>p.sail))].sort();
      const sail = S.binSail && sails.includes(S.binSail) ? S.binSail : sails[0];
      for (const p of props) if (p.sail===sail && Math.abs(p.tws-S.binTws)<=1) S.decisions[p.id]='accept';
      break;
    }
  }
  render();
});

/* ============================================================
   harness
   ============================================================ */
$('sessBtns').innerHTML = ['live','failed','empty']
  .map(s => `<button data-sess="${s}" class="${s==='live'?'on':''}">${s}</button>`).join('');
$('assertBtns').innerHTML = ['recorded','fixed']
  .map(s => `<button data-assert="${s}" class="${s==='recorded'?'on':''}">${s}</button>`).join('');

document.querySelector('.harness').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.sess)   { S.session = b.dataset.sess; S.view = 'session'; }
  if (b.dataset.assert) { S.assertMode = b.dataset.assert; S.decisions = {}; S.bin = null; }
  if (b.dataset.mode)   document.documentElement.dataset.mode = b.dataset.mode;
  if (b.id === 'btnReset') { S.decisions = {}; S.promoted = 0; S.sel = null; S.bin = null; S.expanded = null; }
  syncHarness(); render();
});

function syncHarness(){
  document.querySelectorAll('.harness button').forEach(b => {
    if (b.dataset.sess)   b.classList.toggle('on', b.dataset.sess === S.session);
    if (b.dataset.assert) b.classList.toggle('on', b.dataset.assert === S.assertMode);
    if (b.dataset.mode)   b.classList.toggle('on', b.dataset.mode === document.documentElement.dataset.mode);
  });
}

/* variant switching — URL param, arrows, keyboard */
function setVariant(v){
  S.variant = v; S.sel = null; S.bin = null; S.showProposals = false; S.editing = null;
  const u = new URL(location); u.searchParams.set('variant', v);
  history.replaceState(null, '', u);
  render();
}
const keys = Object.keys(VARIANTS);
$('prev').onclick = () => setVariant(keys[(keys.indexOf(S.variant)+keys.length-1)%keys.length]);
$('next').onclick = () => setVariant(keys[(keys.indexOf(S.variant)+1)%keys.length]);
addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft')  $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
});

setInterval(() => {
  const d = new Date();
  $('clock').textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}, 1000);

S.variant = new URL(location).searchParams.get('variant') || 'A';
if (!VARIANTS[S.variant]) S.variant = 'A';
document.documentElement.dataset.mode = 'night';
render();
</script>
</body>
</html>
