<!--
  THROWAWAY PROTOTYPE for .tickets/nmea-ingestion-build/issues/24-review-screen-prototype.md
  Round 6. Switch with ?variant=A|B|C, the floating bar, or the arrow keys.

  WHY THIS REOPENS AN ACCEPTED PROTOTYPE
  --------------------------------------
  Rounds 1-2 (tape / inbox / polar takes) were rejected as too complex. Round 3
  (10-review-by-leg.html) ran A "one leg at a time, a wizard", B "the race track
  is the primary object", C "the log, all legs as a list", and A WON: the leg as
  the unit of review turns 118 judgements into 17 a sailor can actually make.
  Rounds 4-5 refined the band-and-divider mechanic, verified on a device on
  17 August 2026.

  NONE OF THAT IS REOPENED HERE. The leg is still the unit of review, the band
  mechanic still stands, the inline map is still read-only (16, re-confirmed in
  23 after pinch-zoom read as broken on device).

  What every one of those rounds lacked was A REAL RACE. After 15 August 2026 the
  shipped screen ran against 2:14:49 of Waitemata racing and the complaint was
  structural, not conceptual:

    - everything under the session header is ONE card, with a SECOND card nested
      inside it
    - the primary action sits ~2.5 screens down
    - the ground-wind and low-confidence warnings render BELOW the entire pager
      ([sessionId].tsx:87-110) - a warning that the data may be systematically
      wrong, two and a half screens beneath the UI used to accept that data
    - "can't really see what speed was being done"

  So this round asks one question: WHAT SHAPE IS THE PAGE AROUND THE LEG?
    A  one scroll, decomposed into sibling sections, sticky leg header + action
    B  two screens, a route per leg
    C  two screens, review is a single route holding the pager

  THE DATA IS REAL. Everything below is saturday-race.log replayed through the
  shipped pipeline (rawLogReplayInput -> replayCaptureSession -> detectSailedLegs)
  by features/capture/util/__tests__/prototype24ReviewData.test.ts: real leg
  names off the course, real sample counts, real speed traces, real GPS track,
  real steady stretches. 8,023 samples, 7 legs, 439 to 1,721 samples per leg.
  (The ticket header quotes the device's 6,453 samples and 387/2,410 legs; that
  count is what survived storage and that leg split is pre-ticket-22 detection.)

  The only invented data is session 2, "no sailed legs found" - there is no
  second fixture, so its facts are reconstructed from the device observation.
  It is marked SYNTHETIC in the harness.

  THE GATE, run before the overlay was drawn (recorded in full on the ticket):
    findSteadyStretches over the real race accepts 22.0% of leg time, 72
    stretches, median 20 s, 88 whole 15 s bins, ZERO legs with no stretch.
    The mask fires everywhere, so the overlay stays in.

  THE CHART, per the ticket's settled direction:
    - gridlines and a truthful labelled axis, like the polar chart screen
    - the ceiling is the next 2 kn gridline above the OBSERVED max, not
      max(observed,4) x 1.15. The old corner label ("9 kn" for a 7.8 kn leg) is
      replaced by a dotted max line labelled with the speed actually sailed
    - the no-sail shading is INVERTED, and moved. The trace no longer washes
      itself out at 18% when nothing is attributed - which was every leg on
      open. Attribution is the band's job, and an unattributed block is now
      hatched, which reads at 1 block or 5.
    - the steadiness mask is overlaid: lit columns are the stretches that will
      become polar points, and the selected block reports its bin count live, so
      dragging a divider across a lit region visibly costs or buys a point.
-->

  return bins;
}

  g += `<text x="${w}" y="${h - 3}" text-anchor="end" font-size="9" fill="var(--dim)">${(span/60000).toFixed(1)}′</text>`;

  // steady mask: the stretches that become polar points, lit
  let mask = '';
  if (S.mask){
    for (const st of l.steady){
      const x0 = PAD_L + ((st.startTime - t0) / span) * plotW;
      const x1p = PAD_L + ((st.endTime - t0) / span) * plotW;
      mask += `<rect x="${x0.toFixed(1)}" y="${PAD_T}" width="${Math.max(1, x1p - x0).toFixed(1)}"
        height="${plotH}" fill="var(--accent)" fill-opacity="0.13"/>`;
      mask += `<rect x="${x0.toFixed(1)}" y="${PAD_T + plotH - 2}" width="${Math.max(1, x1p - x0).toFixed(1)}"
        height="2" fill="var(--accent)" fill-opacity="0.85"/>`;
    }
  }

  // the trace: dim everywhere, bright inside a steady stretch. Two passes over
  // the same points, so the pen lifts on a dropout in both.
  const steadyAt = ms => l.steady.some(st => t0 + ms >= st.startTime && t0 + ms < st.endTime);
  const pathFor = wantSteady => {
    let d = '', pen = false;
    for (const [sec, stw] of l.trace){
      if (stw === null){ pen = false; continue; }
      if (S.mask && steadyAt(sec * 1000) !== wantSteady){ pen = false; continue; }
      const px = PAD_L + (sec * 1000 / span) * plotW;
      const py = y(stw);
      d += `${pen ? 'L' : 'M'}${px.toFixed(1)} ${py.toFixed(1)}`;
      pen = true;
    }
    return d;
  };
  const dim = `<path d="${pathFor(false)}" stroke="var(--dim)" stroke-opacity="${S.mask ? 0.75 : 1}"
    stroke-width="1.2" fill="none"/>`;
  const lit = S.mask
    ? `<path d="${pathFor(true)}" stroke="var(--accent)" stroke-width="1.8" fill="none"/>` : '';

  // the observed maximum, where it actually is, labelled as what it is
  const maxLine = `<line x1="${PAD_L}" y1="${y(l.maxStw).toFixed(1)}" x2="${w}" y2="${y(l.maxStw).toFixed(1)}"
      stroke="var(--fg)" stroke-opacity=".35" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="${w - 3}" y="${(y(l.maxStw) - 4).toFixed(1)}" text-anchor="end" font-size="10"
      fill="var(--dim)">max ${l.maxStw} kn</text>`;

  // dividers, on the band's exact axis
  const divs = spans.slice(1).map(s =>
    `<line x1="${(PAD_L + ((s.startTime - t0) / span) * plotW).toFixed(1)}" y1="${PAD_T}"
      x2="${(PAD_L + ((s.startTime - t0) / span) * plotW).toFixed(1)}" y2="${PAD_T + plotH}"
      stroke="var(--fg)" stroke-opacity=".45" stroke-width="1.5"/>`).join('');

  return `<svg width="${w}" height="${h}">${g}${mask}${dim}${lit}${maxLine}${divs}</svg>`;
}

/** The one-line version for a list row: shape only, no axis. */
function sparkline(l, w, h){
  const span = Math.max(1, l.endTime - l.startTime);
  const top = Math.max(2, Math.ceil(l.maxStw / 2) * 2);
  let d = '', pen = false;
  for (const [sec, stw] of l.trace){
    if (stw === null){ pen = false; continue; }
    const px = (sec * 1000 / span) * w, py = h - (stw / top) * h;
    d += `${pen ? 'L' : 'M'}${px.toFixed(1)} ${py.toFixed(1)}`; pen = true;
  }
  const mask = S.mask ? l.steady.map(st => {
    const x0 = ((st.startTime - l.startTime) / span) * w;
    const x1 = ((st.endTime - l.startTime) / span) * w;
    return `<rect x="${x0.toFixed(1)}" y="0" width="${Math.max(1, x1 - x0).toFixed(1)}" height="${h}"
      fill="var(--accent)" fill-opacity=".18"/>`;
  }).join('') : '';
  return `<svg width="${w}" height="${h}">${mask}<path d="${d}" stroke="var(--dim)" stroke-width="1.1" fill="none"/></svg>`;
}

/* ---------------------------- the map ------------------------------ */
function mapView(l, w, h, whole){
  const all = legs();
  const track = whole ? all.flatMap(x => x.track) : l.track;
  if (track.length === 0) return `<div style="height:${h}px"></div>`;
  const lats = track.map(p => p[0]), lons = track.map(p => p[1]);
  const cLat = (Math.min(...lats) + Math.max(...lats)) / 2;
  const k = Math.cos(cLat * Math.PI / 180);
  const pad = 12;
  const xs = lons.map(v => v * k), ys = lats.map(v => -v);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const scale = Math.min((w - pad * 2) / Math.max(1e-9, maxX - minX),
                         (h - pad * 2) / Math.max(1e-9, maxY - minY));
  const px = (lat, lon) => [
    pad + (lon * k - minX) * scale + ((w - pad * 2) - (maxX - minX) * scale) / 2,
    pad + (-lat - minY) * scale + ((h - pad * 2) - (maxY - minY) * scale) / 2,
  ];
  const line = pts => pts.map((p, i) => {
    const [a, b] = px(p[0], p[1]);
    return `${i ? 'L' : 'M'}${a.toFixed(1)} ${b.toFixed(1)}`;
  }).join('');
  const context = whole ? '' : all.filter(x => x !== l).map(x =>
    `<path d="${line(x.track)}" stroke="var(--dim)" stroke-opacity=".35" stroke-width="1.4" fill="none"/>`).join('');
  // one coloured segment per span, so attribution is visible on the water too
  const focus = whole
    ? all.map(x => `<path d="${line(x.track)}" stroke="var(--accent)" stroke-width="2" fill="none"/>`).join('')
    : spansOf(l).map(s => {
        const from = (s.startTime - l.startTime) / Math.max(1, l.endTime - l.startTime);
        const to = (s.endTime - l.startTime) / Math.max(1, l.endTime - l.startTime);
        const pts = l.track.slice(Math.floor(from * l.track.length), Math.ceil(to * l.track.length) + 1);
        if (pts.length < 2) return '';
        const sail = sailOf(s.sailId);
        return `<path d="${line(pts)}" stroke="${sail ? sail.color : 'var(--dim)'}"
          stroke-width="${sail ? 2.6 : 2}" stroke-opacity="${sail ? 1 : .8}" fill="none"/>`;
      }).join('');
  const marks = DATA.marks.map(m => {
    const [a, b] = px(m.lat, m.lon);
    if (a < -20 || a > w + 20 || b < -20 || b > h + 20) return '';
    return `<circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="3" fill="var(--warn)"/>
      <text x="${(a + 5).toFixed(1)}" y="${(b + 3).toFixed(1)}" font-size="9" fill="var(--dim)">${esc(m.name)}</text>`;
  }).join('');
  return `<svg width="${w}" height="${h}" style="background:var(--water);border-radius:12px">
    ${context}${focus}${marks}</svg>`;
}

/* ---------------------------- the band ----------------------------- */
function band(l, w){
  const spans = spansOf(l);
  const t0 = spans[0].startTime, t1 = spans.at(-1).endTime;
  const f = t => ((t - t0) / Math.max(1, t1 - t0)) * 100;
  const sel = S.selected[l.ordinal];
  const blocks = spans.map((s, i) => {
    const sail = sailOf(s.sailId);
    const width = f(s.endTime) - f(s.startTime);
    const label = width * w / 100 >= 34 ? (s.gap ? 'No data' : sail ? esc(sail.name) : '') : '';
    return `<div class="blk ${s.gap ? 'gap' : sail ? '' : 'none'}"
      style="left:${f(s.startTime)}%;width:${width}%;${sail ? `background:${sail.color}` : ''}">
      <span style="background:${sail ? 'rgba(0,0,0,.35)' : 'transparent'};padding:0 3px;border-radius:3px">${label}</span>
      </div>`;
  }).join('');
  const handles = spans.slice(1).map((s, i) =>
    `<div class="hnd" data-act="grab" data-div="${i}" style="left:${f(s.startTime)}%"></div>`).join('');
  const selBox = `<div style="position:absolute;top:0;bottom:0;left:${f(spans[sel].startTime)}%;
    width:${f(spans[sel].endTime) - f(spans[sel].startTime)}%;
    border:2px solid var(--fg);border-radius:6px;pointer-events:none"></div>`;
  return `<div class="band" data-band="${l.ordinal}">${blocks}${selBox}${handles}</div>`;
}

function strip(l){
  const spans = spansOf(l);
  const sel = S.selected[l.ordinal];
  return `<div class="strip">${spans.map((s, i) => {
    const sail = sailOf(s.sailId);
    const bins = binsIn(l, s.startTime, s.endTime);
    const label = s.gap ? 'No data'
      : `${sail ? sail.name + ' ' : ''}${dur(s.endTime - s.startTime)}`;
    return `<div class="sblk ${sel === i ? 'on' : ''}" data-act="select" data-i="${i}">
      <span class="muted xs">${i + 1}</span>
      ${sail ? `<span class="swatch" style="background:${sail.color}"></span>` : ''}
      <span>${esc(label)}</span>
      ${S.mask ? `<span class="xs" style="color:${bins && sail ? 'var(--ok)' : 'var(--dim)'}">${bins}b</span>` : ''}
    </div>`;
  }).join('')}</div>`;
}

function editor(l){
  const spans = spansOf(l);
  const i = S.selected[l.ordinal];
  const s = spans[i];
  const sail = sailOf(s.sailId);
  const bins = binsIn(l, s.startTime, s.endTime);
  const canSplit = (s.endTime - s.startTime) >= MIN_SPAN_MS * 2;
  return `<div class="card sect">
    <div class="row">
      <div class="grow"><b>${sail ? esc(sail.name) : 'No sail'}</b> · ${dur(s.endTime - s.startTime)}</div>

    </div>
    ${S.mask ? `<div class="xs" style="color:${sail && bins ? 'var(--ok)' : 'var(--dim)'}">
        ${bins === 0 ? 'No steady stretch inside this block — it yields no polar point'
                     : `${bins} steady 15 s bin${bins === 1 ? '' : 's'} inside${sail ? '' : ' — attribute a sail to keep them'}`}
      </div>` : ''}
    <div class="row" style="flex-wrap:wrap;gap:6px">
      ${SAILS.map(x => `<div class="chip ${s.sailId === x.id ? 'on' : ''}" data-act="sail" data-sail="${x.id}">
        <span class="swatch" style="background:${x.color};display:inline-block;margin-right:4px"></span>${x.name}</div>`).join('')}
      <div class="chip ${s.sailId === null ? 'on' : ''}" data-act="sail" data-sail="">No sail</div>
    </div>
    <div class="row">
      <div class="btn sm" data-act="nudge" data-edge="start" data-d="-15000">−15s</div>
      <div class="btn sm" data-act="nudge" data-edge="start" data-d="-5000">−5s</div>

    </div>
    <div class="row">
      <div class="btn sm" data-act="nudge" data-edge="end" data-d="-15000">−15s</div>
      <div class="btn sm" data-act="nudge" data-edge="end" data-d="-5000">−5s</div>

      <div class="btn sm grow" data-act="merge" data-dir="left">Merge left</div>
      <div class="btn sm grow" data-act="merge" data-dir="right">Merge right</div>
    </div>
  </div>`;
}

/* ------------------------- shared sections -------------------------- */
function warningBanners(){
  const out = [];
  if (warnsGround()) out.push(`<div class="banner"><span class="ico">⚠</span><div>
    <div class="t">Ground-referenced wind</div>
    <div class="b">This true wind includes tidal current. Any polar made from it may describe
      speed over the ground rather than the boat's performance through the water.</div></div></div>`);
  if (warnsLowWind()) out.push(`<div class="banner"><span class="ico">⚠</span><div>
    <div class="t">Low confidence in light wind</div>
    <div class="b">Wind shear makes readings below about 6 kn less representative of the wind
      acting on the sails.</div></div></div>`);
  return out.join('');
}

function sessionFacts(){
  const s = session();
  return `<div class="stats">
    <div class="stat"><div class="k">Duration</div><div class="v">${dur(s.durationMs)}</div></div>
    <div class="stat"><div class="k">Samples</div><div class="v">${num(s.sampleCount)}</div></div>
    <div class="stat"><div class="k">Wind</div><div class="v">${s.minTws}–${s.maxTws} kn</div></div>
  </div>`;
}

function legListRows(compact){
  const list = legs();
  if (list.length === 0) return `<div class="empty sect">
    <div class="h2">No sailed legs found</div>
    <div class="muted sm">There was usable data, but no point of sail lasted for the three-minute minimum.</div>
    <div class="btn sm" data-act="noop">Detect legs again</div>
  </div>`;
  return list.map((l, i) => `<div class="legrow ${i === S.legIndex ? 'on' : ''}" data-act="openLeg" data-i="${i}">
    <div class="col grow" style="gap:2px;min-width:0">
      <div class="row">
        <b class="sm" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.name)}</b>
        ${S.confirmed[l.ordinal] ? '<span class="pill ok">done</span>' : ''}
      </div>
      <div class="muted xs">${clock(l.startTime)} · ${mins(l.durationMs)} · ${num(l.sampleCount)} samples
        ${S.mask ? `· ${attributedBins(l)}/${legBins(l)} bins` : ''}</div>
      ${compact ? '' : `<div class="row" style="gap:4px;margin-top:2px">${
        spansOf(l).filter(s => s.sailId !== null).map(s => {
          const sail = sailOf(s.sailId);
          return `<span class="pill" style="background:${sail.color};color:#0b1220">${sail.name}</span>`;
        }).join('') || '<span class="pill dim">no sail assigned</span>'}</div>`}
    </div>
    ${sparkline(l, 74, 26)}
    <span class="arrow">›</span>
  </div>`).join('');
}

/** The leg's own work, as sibling sections. No card wraps another card. */
function legSections(l, w){
  return `
    <div class="sect pad">
      <div class="h3">Where</div>

    <div class="sect pad" style="padding-top:0">
      <div class="row">
        <div class="h3 grow">Speed and steadiness</div>
        <span class="muted xs">${S.mask ? `${legBins(l)} bins available` : `max ${l.maxStw} kn`}</span>

    </div>
    <div class="sect pad" style="padding-top:0">
      <div class="h3">Selected block</div>

}

        <span>${esc(l.name)}</span>
        <span class="muted xs" style="font-weight:400">Leg ${S.legIndex + 1} of ${list.length} · ${num(l.sampleCount)} samples · ${mins(l.durationMs)}</span>
      </div>
      <div class="btn sm" data-act="legPrev" ${S.legIndex === 0 ? 'style="opacity:.35"' : ''}>‹</div>
      <div class="btn sm" data-act="legNext" ${S.legIndex === list.length - 1 ? 'style="opacity:.35"' : ''}>›</div>
    </div>
    <div class="row pad" style="padding:8px 12px 0">
      <span class="muted xs grow">${edited(l) ? 'Saved' : 'Opening default — nothing changed yet'}</span>
      <div class="chip ${S.used[l.ordinal] === false ? '' : 'on'}" data-act="toggleUsed">
        ${S.used[l.ordinal] === false ? 'Not used' : 'Used'}</div>
    </div>
    <div class="screen">${legSections(l, W)}<div style="height:8px"></div></div>`
    : '<div class="screen"><div class="empty muted">No leg open.</div></div>';

  return `
  <div class="phonewrap">
    <div class="phonelabel">D · /session/[id] — the list is home</div>
    <div class="phone ${S.screen === 'leg' ? 'ghost' : ''}">
      <div class="statusbar"><span>${clock(Date.now())}</span><span>▮▮▮ 74%</span></div>
      ${sessionPhone}
    </div>
  </div>
  <div class="phonewrap">
    <div class="phonelabel">D · /session/[id]/leg/[ordinal] — paged by replace</div>
    <div class="phone ${S.screen === 'leg' ? '' : 'ghost'}">
      <div class="statusbar"><span>${clock(Date.now())}</span><span>▮▮▮ 74%</span></div>
      ${legPhone}
    </div>
  </div>`;
}

/** D's list row: what this leg yields and whether it was touched — no tick. */
function legListRowsD(){
  const list = legs();
  if (list.length === 0) return legListRows(false);
  return list.map((l, i) => {
    const bins = legBins(l), got = attributedBins(l);
    const unused = S.used[l.ordinal] === false;
    return `<div class="legrow ${i === S.legIndex ? 'on' : ''}" data-act="openLeg" data-i="${i}">
      <div class="col grow" style="gap:2px;min-width:0">
        <div class="row">
          <b class="sm" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
            ${unused ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(l.name)}</b>
          ${edited(l) ? '<span class="pill dim">edited</span>' : ''}
        </div>
        <div class="muted xs">${clock(l.startTime)} · ${mins(l.durationMs)} · ${num(l.sampleCount)} samples</div>
        <div class="row" style="gap:4px;margin-top:2px">${
          spansOf(l).filter(s => s.sailId !== null).map(s => {
            const sail = sailOf(s.sailId);
            return `<span class="pill" style="background:${sail.color};color:#0b1220">${sail.name}</span>`;
          }).join('') || '<span class="pill dim">no sail assigned</span>'}
          ${S.mask ? `<span class="pill ${got ? 'ok' : 'dim'}">${got}/${bins} bins</span>` : ''}
        </div>
      </div>
      ${sparkline(l, 74, 26)}
      <span class="arrow">›</span>
    </div>`;
  }).join('');
}

/* ----------------------------- captions ----------------------------- */
const CAPTIONS = {

/* ------------------------------ render ------------------------------ */
function render(){
  const body = S.variant === 'A' ? variantA() : S.variant === 'B' ? variantB()
    : S.variant === 'C' ? variantC() : variantD();
  $('stage').innerHTML = body + `<div class="caption">${CAPTIONS[S.variant]}
    ${S.session === 'empty'
      ? `<h4>Session 2 — synthetic</h4><p>There is no second fixture. These facts are
         reconstructed from the device observation: 22 min, 1,284 samples, ground-referenced
         wind, 5.4 kn peak. Both warnings fire honestly, and the whole leg surface collapses to
         the empty state. In A that leaves a header and a dead end; in B and C the empty state
         has a screen of its own to sit in.</p>`
      : `<h4>The ugly cases, all real</h4>
         <p>Leg 7 <i>Bayswater → Westhaven</i> is 439 samples over 7.4 min with 3 steady
         stretches. Leg 5 <i>Salt Works → Orakei</i> is 1,721 samples over 28.9 min with 24.
         Page between them and watch the trace, the band and the block strip cope — that
         4× spread is what the shipped screen never had in it.</p>`}
    <h4>The chart</h4>
    <p>Ceiling is the next 2 kn gridline above the observed max, not
    <code>max(observed,4)×1.15</code>; the dotted line is the speed actually sailed and says
    so. Lit columns are <code>findSteadyStretches</code> — 22.0 % of leg time across this race,
    72 stretches, 88 bins. The block strip and editor report bins live, so dragging a divider
    across a lit region visibly costs or buys a polar point. Unattributed is now
    <b>hatched on the band</b> rather than an 18 % wash over the trace, which is why "nothing
    is attributed here" still reads when nothing is.</p>
  </div>`;

  const list = legs();
  const progress = S.variant === 'D'
    ? `${list.filter(edited).length} edited`
    : `${Object.keys(S.confirmed).length} confirmed`;
  $('counts').textContent = list.length
    ? `${list.length} legs · ${progress} · ` +
      `${list.reduce((s, l) => s + attributedBins(l), 0)}/${list.reduce((s, l) => s + legBins(l), 0)} bins attributed`
    : 'no sailed legs';
  $('vlabel').textContent = { A: 'A · one scroll, sibling sections',
    B: 'B · two screens, a route per leg', C: 'C · two screens, one review route',
    D: 'D · list is home, one route names the leg' }[S.variant];
}

/* ---------------------------- interaction --------------------------- */
function moveDivider(l, index, time){
  const spans = spansOf(l);
  const lo = spans[index].startTime + MIN_SPAN_MS;
  const hi = spans[index + 1].endTime - MIN_SPAN_MS;
  const at = clamp(time, lo, hi);
  spans[index].endTime = at;
  spans[index + 1].startTime = at;
}

$('stage').addEventListener('pointerdown', e => {
  const bandEl = e.target.closest('.band');
  if (!bandEl) return;
  const l = leg(); if (!l) return;
  const spans = spansOf(l);
  if (spans.length < 2) return;
  const rect = bandEl.getBoundingClientRect();
  const t0 = spans[0].startTime, t1 = spans.at(-1).endTime;
  const timeAt = clientX => t0 + ((clientX - rect.left) / rect.width) * (t1 - t0);
  // nearest divider to the grab, the same rule as spanEditing.findNearestDivider
  const grabbed = timeAt(e.clientX);
  let index = 0, best = Infinity;
  spans.slice(1).forEach((s, i) => {
    const d = Math.abs(s.startTime - grabbed);
    if (d < best){ best = d; index = i; }
  });
  const move = ev => { moveDivider(l, index, timeAt(ev.clientX)); render(); };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  e.preventDefault();
});

$('stage').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  const l = leg();
  const spans = l ? spansOf(l) : null;
  const sel = l ? S.selected[l.ordinal] : 0;
  switch (a){
    case 'openLeg': S.legIndex = +el.dataset.i; S.screen = 'leg'; break;
    case 'startReview': {
      const first = legs().findIndex(x => !S.confirmed[x.ordinal]);
      S.legIndex = first < 0 ? 0 : first; S.screen = 'leg'; break;
    }
    case 'back': S.screen = 'session'; break;
    case 'legPrev': S.legIndex = Math.max(0, S.legIndex - 1); break;
    case 'legNext': S.legIndex = Math.min(legs().length - 1, S.legIndex + 1); break;
    case 'confirm':
      S.confirmed[l.ordinal] = true;
      if (S.legIndex < legs().length - 1) S.legIndex += 1;
      else S.screen = 'session';
      break;
    case 'confirmPush':
      S.confirmed[l.ordinal] = true;
      if (S.legIndex < legs().length - 1) S.legIndex += 1;
      else S.screen = 'session';
      break;
    case 'select': S.selected[l.ordinal] = +el.dataset.i; break;
    case 'sail':
      if (spans[sel].gap) break;
      spans[sel].sailId = el.dataset.sail ? +el.dataset.sail : null;
      break;
    case 'nudge': {
      const d = +el.dataset.d, edge = el.dataset.edge;
      if (edge === 'start' && sel > 0){
        const lo = spans[sel - 1].startTime + MIN_SPAN_MS;
        const hi = spans[sel].endTime - MIN_SPAN_MS;
        const at = clamp(spans[sel].startTime + d, lo, hi);
        spans[sel].startTime = at; spans[sel - 1].endTime = at;
      }
      if (edge === 'end' && sel < spans.length - 1){
        const lo = spans[sel].startTime + MIN_SPAN_MS;
        const hi = spans[sel + 1].endTime - MIN_SPAN_MS;
        const at = clamp(spans[sel].endTime + d, lo, hi);
        spans[sel].endTime = at; spans[sel + 1].startTime = at;
      }
      break;
    }
    case 'split': {
      const s = spans[sel];
      if (s.endTime - s.startTime < MIN_SPAN_MS * 2) break;
      const mid = Math.round((s.startTime + s.endTime) / 2);
      spans.splice(sel + 1, 0, { startTime: mid, endTime: s.endTime, sailId: s.sailId, gap: false });
      s.endTime = mid;
      S.selected[l.ordinal] = sel + 1;
      break;
    }
    case 'merge': {
      const dir = el.dataset.dir;
      const other = dir === 'left' ? sel - 1 : sel + 1;
      if (other < 0 || other >= spans.length) break;
      const lo = Math.min(sel, other), hi = Math.max(sel, other);
      spans[lo] = { startTime: spans[lo].startTime, endTime: spans[hi].endTime,
        sailId: spans[sel].sailId, gap: false };
      spans.splice(hi, 1);
      S.selected[l.ordinal] = lo;
      break;
    }
    case 'toggleUsed':
      S.used[l.ordinal] = S.used[l.ordinal] === false ? true : false;
      break;
    case 'noop': return;
  }
  render();
});

document.querySelector('.harness').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.session){ S.session = b.dataset.session; S.legIndex = 0; S.screen = 'session'; }
  if (b.dataset.warn) S.warn = b.dataset.warn === 'on';
  if (b.dataset.mask) S.mask = b.dataset.mask === 'on';
  if (b.dataset.mode) document.documentElement.dataset.mode = b.dataset.mode;
  if (b.id === 'btnReset'){ resetSpans(); S.legIndex = 0; S.screen = 'session'; }
  if (b.id === 'btnShort'){
    S.session = 'race';
    S.legIndex = DATA.legs.indexOf(DATA.legs.reduce((a, x) => x.sampleCount < a.sampleCount ? x : a));
    S.screen = 'leg';
  }
  if (b.id === 'btnLong'){
    S.session = 'race';
    S.legIndex = DATA.legs.indexOf(DATA.legs.reduce((a, x) => x.sampleCount > a.sampleCount ? x : a));
    S.screen = 'leg';
  }
  document.querySelectorAll('.harness button').forEach(x => {
    if (x.dataset.session) x.classList.toggle('on', x.dataset.session === S.session);
    if (x.dataset.warn) x.classList.toggle('on', (x.dataset.warn === 'on') === S.warn);
    if (x.dataset.mask) x.classList.toggle('on', (x.dataset.mask === 'on') === S.mask);
    if (x.dataset.mode) x.classList.toggle('on', x.dataset.mode === document.documentElement.dataset.mode);
  });
  render();
});

function setVariant(v){
  S.variant = v;
  const u = new URL(location); u.searchParams.set('variant', v);
  history.replaceState(null, '', u);
  render();
}
const keys = ['A', 'B', 'C', 'D'];
$('prev').onclick = () => setVariant(keys[(keys.indexOf(S.variant) + keys.length - 1) % keys.length]);
$('next').onclick = () => setVariant(keys[(keys.indexOf(S.variant) + 1) % keys.length]);
addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft') $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
});

S.variant = new URL(location).searchParams.get('variant') || 'A';
if (!keys.includes(S.variant)) S.variant = 'A';
document.documentElement.dataset.mode = 'night';
render();
</script>
</body>
</html>
