<title>PROTOTYPE — 10 review by course leg (r5)</title>
<!--
  THROWAWAY PROTOTYPE for .tickets/nmea-ingestion/issues/10-review-and-promotion-screen.md
  Round 5. Round 4's shape was right; this collapses three separate mechanisms
  into one, following Logan's note:

    "Multiple sails per leg should be able to change start/end of each sail.
     Think this could replace the trimming start/end functionality maybe?"

  Yes — and it replaces the mid-leg cuts too. A leg is now just A ROW OF SPANS.
  Every span carries either a sail or nothing:

      [ not used ][   J1   ][ not used ][   J1   ][ not used ]
        the hoist                 a cut                the drop

  So the three things round 4 had as separate controls — trim the start, trim
  the end, cut a section out of the middle — are all the same act: mark a span
  as not used. Sail changes are the same act too: give two adjacent spans
  different sails. One model, one gesture, and any number of cuts for free.

  Also in this round:
    - drag the band to move the nearest boundary; or select a span and nudge it
    - every span is editable and deletable, including cuts (Logan's note 3 & 4)
    - the final review is per sail AND per rough TWA band (note 5)
    - the map focuses the leg or shows the whole course, from a chip on the map
      itself rather than a global setting (note 6: "maybe we could have both")

  Data: the same 2-hour windward-leeward nmea-sim race as round 4, reduced
  through ticket 05's row shape (7,035 rows), legs detected on median |TWA|
  over a +/-90 s window (14/14 roundings, 0 spurious, median error 33 s).
  Sail stamps are ticket 09's model, wrong the three usual ways.
-->

/* ============================================================ helpers */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const W = 336, LEGS = DATA.legs;
const SAIL_COLORS = { J1:'#3b82f6', A6:'#f97316', A5:'#eab308', A3:'#a855f7', A2:'#ec4899', S1:'#14b8a6' };
const ALL_SAILS = ['J1','A6','A5','A3','A2','S1'];
const col = s => SAIL_COLORS[s] || '#64748b';
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lin = (d0,d1,r0,r1) => v => r0 + ((v-d0)/((d1-d0)||1))*(r1-r0);
const median = xs => { const s=[...xs].sort((a,b)=>a-b), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const pctl = (xs,p) => { const s=[...xs].sort((a,b)=>a-b); return s[Math.min(s.length-1,Math.floor(p*s.length))]; };
const mmss = s => `${Math.floor(s/60)}m ${String(Math.round(s)%60).padStart(2,'0')}s`;
const clk = s => `${Math.floor(s/3600)}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(Math.round(s)%60).padStart(2,'0')}`;
const MINSPAN = 15;   // seconds — below this a span can't hold a bin anyway

/* ============================================================ the model
   A leg is a ROW OF SPANS. Each span carries a sail, or null meaning "not
   used". That single idea covers what round 4 needed three mechanisms for:
     first span null  = trim off the hoist
     last span null   = trim off the drop
     middle span null = cut a section out
     two spans, different sails = a sail change mid-leg
   A span is stored as its start; it runs to the next span's start. */
const stampSail = t => { let s = null; for (const [at, sail] of DATA.stamps){ if (at > t) break; s = sail; } return s; };

function defaultSpans(l){
  // the old trim defaults, expressed as spans
  const sail = stampSail(l.from + Math.round(l.dur/2));
  return [
    { from: l.from, sail: null },
    { from: l.from + DATA.detection.TRIM_HEAD, sail },
    { from: l.to - DATA.detection.TRIM_TAIL, sail: null },
  ];
}

const S = {
  view: 'leg', i: 0, sel: 1,          // sel = index of the selected span
  mapFocus: true,                      // true = this leg, false = whole course
  truth: false, course: true,
  legs: LEGS.map(l => ({ use: true, spans: defaultSpans(l) })),
};
const st = i => S.legs[i];
const L = i => LEGS[i];
const spanEnd = (i, k) => { const s = st(i).spans; return k+1 < s.length ? s[k+1].from : L(i).to; };

const legName = i => {
  const l = L(i);
  if (S.course) return `${l.fromMark} → ${l.toMark}`;
  const n = LEGS.slice(0, i+1).filter(x => x.kind === l.kind).length;
  return `${l.kind} ${n}`;
};
const prevSail = i => {
  for (let k=i-1;k>=0;k--){ const used = st(k).spans.filter(s=>s.sail); if (used.length) return used[used.length-1].sail; }
  return null;
};

/* points for a leg: every span that carries a sail contributes, and spans with
   the same sail pool together inside the leg */
function pointsFor(i){
  const s = st(i);
  if (!s.use) return [];
  const bins = new Map();
  const rows = DATA.legSeries[i];
  for (let k=0;k<s.spans.length;k++){
    const sail = s.spans[k].sail;
    if (!sail) continue;
    const a = s.spans[k].from, b = spanEnd(i,k);
    for (const r of rows){
      if (r[0] < a || r[0] >= b) continue;
      if (r[1]===null || r[2]===null || r[3]===null) continue;
      const key = `${sail}|${Math.round(r[2])}|${Math.round(Math.abs(r[3])/4)*4}`;
      if (!bins.has(key)) bins.set(key, []);
      bins.get(key).push(r[1]);
    }
  }
  const out = [];
  for (const [key,v] of bins){
    if (v.length < 8) continue;
    const [sail,tws,twa] = key.split('|');
    out.push({ sail, tws:+tws, twa:+twa, speed:+median(v).toFixed(2), n:v.length,
               sp:[+pctl(v,.1).toFixed(2), +pctl(v,.9).toFixed(2)] });
  }
  return out.sort((a,b)=>a.sail.localeCompare(b.sail)||a.twa-b.twa||a.tws-b.tws);
}
const allPoints = () => LEGS.flatMap((_,i)=>pointsFor(i));
const totalPoints = () => allPoints().length;

/* ============================================================ map
   Logan: "don't mind the leg zooming — maybe we could have both?" So the chip
   on the map switches between focusing this leg and the whole course, and it
   lives ON the map rather than being a global setting. */
function courseMap(i, w, h){
  const l = L(i), s = st(i);
  const all = DATA.wholeTrack;
  let cx, cy, span;
  if (S.mapFocus){
    const xs = l.track.map(p=>p[0]), ys = l.track.map(p=>p[1]);
    cx=(Math.min(...xs)+Math.max(...xs))/2; cy=(Math.min(...ys)+Math.max(...ys))/2;
    span = Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys), 200)*1.3;
  } else {
    const xs = all.map(p=>p[0]), ys = all.map(p=>p[1]);
    cx=(Math.min(...xs)+Math.max(...xs))/2; cy=(Math.min(...ys)+Math.max(...ys))/2;
    span = Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys))*1.06;
  }
  const X = lin(cx-span/2, cx+span/2, 0, w), Y = lin(cy-span/2, cy+span/2, h, 0);
  let base=''; for (let k=0;k<all.length;k++) base += `${k?'L':'M'}${X(all[k][0]).toFixed(1)} ${Y(all[k][1]).toFixed(1)} `;

  // draw the leg span by span, in each span's own colour — so the map shows
  // the cuts and the sail changes too, not just "the leg"
  const spanPaths = st(i).spans.map((sp,k) => {
    const a = sp.from, b = spanEnd(i,k);
    let d='', pen=false;
    for (const p of l.track){
      if (p[2] < a || p[2] > b){ pen=false; continue; }
      d += `${pen?'L':'M'}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)} `; pen=true;
    }
    if (!d) return '';
    const c = sp.sail ? col(sp.sail) : 'rgba(148,163,184,.40)';
    return `<path d="${d}" stroke="${c}" stroke-width="${S.sel===k?7:5}" fill="none"
      stroke-linecap="round" ${sp.sail?'':'stroke-dasharray="2 5"'}/>`;
  }).join('');

  const a = l.track[0], b = l.track[l.track.length-1];
  return `<div class="mapwrap">
    <svg width="${w}" height="${h}">
      <rect x="0" y="0" width="${w}" height="${h}" rx="12" fill="var(--panel)"/>
      <path d="${base}" stroke="var(--line)" stroke-width="1.5" fill="none" opacity=".85"/>
      ${spanPaths}
      ${a?`<circle cx="${X(a[0])}" cy="${Y(a[1])}" r="4.5" fill="var(--dim)"/>`:''}
      ${b?`<circle cx="${X(b[0])}" cy="${Y(b[1])}" r="4.5" fill="var(--fg)"/>`:''}
      ${S.course ? DATA.marks.map(m=>`
        <path d="M${X(m.x)} ${Y(m.y)-7} l6 11 l-12 0 z" fill="var(--warn)"/>
        <text x="${X(m.x)+9}" y="${Y(m.y)+4}" font-size="10" fill="var(--warn)">${m.name}</text>`).join('') : ''}
    </svg>
    <button class="mapchip" data-act="mapToggle">${S.mapFocus?'⤢ whole course':'⤡ focus leg'}</button>
  </div>`;
}

/* ============================================================ trace + band */
function traceAndBand(i, w){
  const l = L(i), s = st(i), rows = DATA.legSeries[i];
  const h = 62, bh = 30;
  const x = lin(l.from, l.to, 0, w);

  for (let k=0;k<rows.length;k+=stride){
    const r = rows[k];
    if (r[1]===null){ pen=false; continue; }
    d += `${pen?'L':'M'}${x(r[0]).toFixed(1)} ${y(r[1]).toFixed(1)} `; pen=true;
  }
  return `
  <svg width="${w}" height="${h}">
    <rect x="0" y="0" width="${w}" height="${h}" rx="8" fill="var(--panel)"/>
    ${s.spans.map((seg,k)=>{
      const a=x(seg.from), b=x(spanEnd(i,k));
      return seg.sail ? '' : `<rect x="${a}" y="0" width="${Math.max(1,b-a)}" height="${h}" fill="rgba(148,163,184,.20)"/>`;
    }).join('')}
    <path d="${d}" stroke="var(--fg)" stroke-width="1.4" fill="none"/>
    ${s.spans.slice(1).map(seg=>`<line x1="${x(seg.from)}" y1="0" x2="${x(seg.from)}" y2="${h}"
      stroke="var(--accent)" stroke-width="1.5"/>`).join('')}
  </svg>
  <svg width="${w}" height="${bh}" id="band" data-i="${i}" style="margin-top:4px">
    ${s.spans.map((seg,k)=>{
      const a=x(seg.from), b=x(spanEnd(i,k)), wd=Math.max(2,b-a);
      const c = seg.sail ? col(seg.sail) : 'var(--panel2)';
      return `<rect x="${a}" y="0" width="${wd}" height="${bh}" rx="5" fill="${c}"
                opacity="${seg.sail?0.9:1}" stroke="${S.sel===k?'var(--fg)':'var(--line)'}"
                stroke-width="${S.sel===k?2.5:1}" style="cursor:pointer" data-act="selSpan" data-k="${k}"/>
              ${wd>26?`<text x="${a+wd/2}" y="${bh/2+4}" font-size="10" font-weight="700" text-anchor="middle"
                fill="${seg.sail?'#04121c':'var(--dim)'}" style="pointer-events:none">${seg.sail||'—'}</text>`:''}`;
    }).join('')}
    ${s.spans.slice(1).map((seg,k)=>`<circle cx="${x(seg.from)}" cy="${bh/2}" r="5"
       fill="var(--fg)" stroke="var(--bg)" stroke-width="2" style="cursor:ew-resize"/>`).join('')}
  </svg>
  <div class="xs muted" style="margin-top:4px">Drag the band to move the nearest divider. Tap a block to edit it.</div>`;
}

/* ============================================================ leg screen */
function renderLeg(){
  const i = S.i, l = L(i), s = st(i), pts = pointsFor(i);
  const k = Math.min(S.sel, s.spans.length-1);
  const seg = s.spans[k];
  const segFrom = seg.from, segTo = spanEnd(i,k);
  const usedSec = s.spans.reduce((a,sp,j)=> a + (sp.sail ? spanEnd(i,j)-sp.from : 0), 0);

  return `
  <div class="pager">
    <button data-act="prev" ${i===0?'disabled':''}>‹</button>
    <span class="grow" style="text-align:center">
      <div class="sm" style="font-weight:600">Leg ${i+1} of ${LEGS.length}</div>
      <div class="xs muted">${clk(l.from)} · lap ${l.lap}</div>
    </span>
    <button data-act="next" ${i===LEGS.length-1?'disabled':''}>›</button>
  </div>

  <div class="pad" style="padding-bottom:86px">
    <div class="row">
      <span class="grow">
        <div class="h1">${legName(i)}</div>
        <div class="xs muted">${l.kind} · ${mmss(l.dur)} · ${l.tacks} ${l.kind==='Beat'?'tack':'gybe'}${l.tacks===1?'':'s'} · TWA ${l.twa}° · TWS ${l.tws} kn</div>
      </span>
      ${S.truth?`<span class="pill ${truthOk(i)?'good':'warn'}">was ${l.truthSails.join('/')}</span>`:''}
    </div>

    <div style="margin-top:12px">${courseMap(i, W-28, 180)}</div>

    <div class="row" style="margin:14px 0 6px">
      <span class="sm grow" style="font-weight:600">Sails and cuts</span>
      <span class="xs muted">${s.spans.filter(x=>x.sail).length} used · ${s.spans.filter(x=>!x.sail).length} cut</span>
    </div>
    ${traceAndBand(i, W-28)}

    <div class="card" style="margin-top:10px">
      <div class="row">
        <span class="grow sm" style="font-weight:600">
          ${seg.sail ? `${seg.sail} block` : 'Cut'} · ${mmss(segTo-segFrom)}
        </span>
        <span class="xs muted mono">${clk(segFrom)}–${clk(segTo)}</span>
      </div>

      <div class="row" style="flex-wrap:wrap;gap:5px;margin-top:8px">
        ${ALL_SAILS.map(x=>`<button class="sail" data-act="setSail" data-sail="${x}"
          style="${seg.sail===x?`background:${col(x)};color:#04121c;border-color:${col(x)}`:''}">${x}</button>`).join('')}
        <button class="sail" data-act="setSail" data-sail=""
          style="${!seg.sail?'background:var(--dim);color:#04121c;border-color:var(--dim)':''}">don't use</button>
      </div>
      ${!seg.sail && prevSail(i) && k===1 ? `<div class="xs" style="color:var(--warn);margin-top:6px">
        Nothing stamped on this leg — last leg was ${prevSail(i)}.
        <button class="btn tiny" data-act="carry">use ${prevSail(i)}</button></div>`:''}

      <div class="row" style="gap:4px;margin-top:10px">
        <span class="xs muted" style="width:28px">start</span>
        <button class="btn tiny" data-act="edge" data-edge="from" data-d="-15" ${k===0?'disabled':''}>−15s</button>
        <button class="btn tiny" data-act="edge" data-edge="from" data-d="-5"  ${k===0?'disabled':''}>−5s</button>
        <button class="btn tiny" data-act="edge" data-edge="from" data-d="5"   ${k===0?'disabled':''}>+5s</button>
        <button class="btn tiny" data-act="edge" data-edge="from" data-d="15"  ${k===0?'disabled':''}>+15s</button>
        ${k===0?'<span class="xs muted">leg start</span>':''}
      </div>
      <div class="row" style="gap:4px;margin-top:5px">
        <span class="xs muted" style="width:28px">end</span>
        <button class="btn tiny" data-act="edge" data-edge="to" data-d="-15" ${k===s.spans.length-1?'disabled':''}>−15s</button>
        <button class="btn tiny" data-act="edge" data-edge="to" data-d="-5"  ${k===s.spans.length-1?'disabled':''}>−5s</button>
        <button class="btn tiny" data-act="edge" data-edge="to" data-d="5"   ${k===s.spans.length-1?'disabled':''}>+5s</button>
        <button class="btn tiny" data-act="edge" data-edge="to" data-d="15"  ${k===s.spans.length-1?'disabled':''}>+15s</button>
        ${k===s.spans.length-1?'<span class="xs muted">leg end</span>':''}
      </div>

      <div class="row" style="gap:5px;margin-top:10px">
        <button class="btn tiny" data-act="split">✂ split here</button>
        <button class="btn tiny" data-act="merge" ${s.spans.length<2||k===0?'disabled':''}>merge into previous</button>
      </div>
    </div>

    <div class="card" style="margin-top:10px">
      <div class="row">
        <span class="grow">
          <div class="h1" style="font-size:19px">${pts.length} point${pts.length===1?'':'s'}</div>
          <div class="xs muted">from ${mmss(usedSec)} of ${mmss(l.dur)}</div>
        </span>
        <label class="toggle" data-act="toggleUse">
          <span class="xs muted">use leg</span><span class="knob ${s.use?'on':''}"><i></i></span>
        </label>
      </div>
      ${pts.length?`<div class="row" style="gap:4px;flex-wrap:wrap;margin-top:8px">
        ${[...new Set(pts.map(p=>p.sail))].map(sl=>{const n=pts.filter(p=>p.sail===sl).length;
          return `<span class="pill" style="background:${col(sl)}22;color:${col(sl)}">
            <span class="sw" style="background:${col(sl)}"></span> ${sl} ${n}</span>`;}).join('')}
      </div>`:''}
    </div>
  </div>

  <div style="position:absolute;left:14px;right:14px;bottom:14px">
    <button class="btn primary big" data-act="review">Review ${totalPoints()} points →</button>
  </div>`;
}

const truthOk = i => { const t = L(i).truthSails;
  const used = [...new Set(st(i).spans.filter(s=>s.sail).map(s=>s.sail))];
  return used.length && used.every(x=>t.includes(x)); };

/* ============================================================ review
   Logan: "like that it's per-sail, although unsure on the info. Maybe per-sail
   per rough TWA?" So: per sail, then per 10-degree TWA band, with what the
   band says and what your table says. */
const TWA_BAND = 10;
function renderReview(){
  const pts = allPoints();
  const bySail = {};
  for (const p of pts) (bySail[p.sail] = bySail[p.sail]||[]).push(p);
  const usedLegs = LEGS.filter((_,i)=>st(i).use && pointsFor(i).length).length;

  return `
  <div class="pager">
    <button data-act="backToLegs">‹</button>
    <span class="grow" style="text-align:center"><div class="sm" style="font-weight:600">Review</div>
      <div class="xs muted">before anything is written</div></span>
    <span style="width:38px"></span>
  </div>
  <div class="pad" style="padding-bottom:86px">
    <div class="h1">${pts.length} points</div>
    <div class="xs muted" style="margin-bottom:14px">
      from ${usedLegs} of ${LEGS.length} legs · ${esc(DATA.session.name)}</div>

    ${Object.entries(bySail).sort().map(([sail, ps]) => {
      const ex = DATA.existing[sail]||[];
      const near = p => { let b=null,bd=Infinity;
        for (const q of ex){ const dd=(q.tws-p.tws)**2+((q.twa-p.twa)*0.25)**2; if(dd<bd){bd=dd;b=q;} }
        return bd>36?null:b.speed; };
      // group into rough TWA bands
      const bands = {};
      for (const p of ps){ const b = Math.floor(p.twa/TWA_BAND)*TWA_BAND; (bands[b]=bands[b]||[]).push(p); }
      return `<div class="card" style="margin-bottom:8px">
        <div class="row">
          <span class="sw" style="width:10px;height:22px;border-radius:3px;background:${col(sail)}"></span>
          <span class="grow" style="font-weight:600">${sail}</span>
          <span class="sm">${ps.length} pts</span>
        </div>
        <div class="row xs muted" style="margin:8px 0 2px">
          <span style="width:74px">TWA</span><span style="width:46px">TWS</span>
          <span style="width:52px">this race</span><span style="width:44px">yours</span><span class="grow">±</span>
        </div>
        ${Object.entries(bands).sort((a,b)=>a[0]-b[0]).map(([b, bp]) => {
          const sp = median(bp.map(p=>p.speed));
          const exs = bp.map(near).filter(v=>v!==null);
          const e = exs.length ? median(exs) : null;
          const dl = e===null ? null : (sp-e)/e*100;
          const tws = bp.map(p=>p.tws);
          return `<div class="twarow">
            <span class="sm mono" style="width:74px">${b}–${+b+TWA_BAND}°</span>
            <span class="xs muted mono" style="width:46px">${Math.min(...tws)}–${Math.max(...tws)}</span>
            <span class="sm mono" style="width:52px">${sp.toFixed(2)}</span>
            <span class="xs muted mono" style="width:44px">${e===null?'—':e.toFixed(2)}</span>
            <span class="xs mono grow" style="color:${dl===null?'var(--accent)':dl>=0?'var(--ok)':'var(--bad)'}">
              ${dl===null?'new':(dl>0?'+':'')+dl.toFixed(1)+'%'}</span>
            <span class="xs muted">${bp.length}pt</span>
          </div>`;
        }).join('')}
      </div>`;
    }).join('')}

    <div class="card">
      <div class="xs muted">Tagged to this session, so the whole lot can be taken
      back out later without touching your imported table.</div>
    </div>
  </div>
  <div style="position:absolute;left:14px;right:14px;bottom:14px">
    <button class="btn primary big" data-act="commit">Add ${pts.length} points</button>
  </div>`;
}

/* ============================================================ caption */
const CAPTION = () => `
  <h3>Round 5 — a leg is a row of spans</h3>
  <p>Your note — <i>"changing the start/end of each sail could replace the
  trimming"</i> — turns out to replace the cuts as well. One idea now covers all
  three:</p>
  <p class="mono xs" style="background:#111820;padding:10px;border-radius:8px;line-height:1.9">
    [ not used ][&nbsp;&nbsp;J1&nbsp;&nbsp;][ not used ][&nbsp;&nbsp;J1&nbsp;&nbsp;][ not used ]<br>
    &nbsp;&nbsp;the hoist&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;a cut&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;the drop</p>
  <p>Trim the start, trim the end, cut the middle, change sail mid-leg — all the
  same act now: <b>give a block a sail, or mark it not used</b>. Any number of
  cuts falls out for free, and every block is editable and deletable, which the
  round-4 cuts weren't.</p>
  <h4>What to try</h4>
  <ul>
    <li><b>Drag the band</b> — it moves the nearest divider. Or tap a block and
      nudge its start/end by ±5 s / ±15 s.</li>
    <li><b>✂ split here</b> then set one half to <b>don't use</b> — that is a
      mid-leg cut. Do it twice for two cuts.</li>
    <li><b>merge into previous</b> deletes a divider, which is how you undo a cut
      or a sail change.</li>
    <li>The map draws <b>each block in its own colour</b>, so the cuts and the
      sail change are visible on the water, not just on the trace.</li>
    <li><span class="q">The chip on the map</span> switches focus-leg ⟷
      whole-course. It sits on the map rather than in settings, so it's per
      glance rather than a mode you have to remember.</li>
  </ul>
  <h4>Review, per sail and per rough TWA</h4>
  <p>Now a table: 10° TWA bands, the TWS range that fed each, <b>what this race
  says</b>, <b>what your table says</b>, and the gap. That is the comparison a
  sailor can argue with — "we were 4% quick at 40–50°" — where a scatter of 231
  dots was not.</p>
  <h4 class="bad">Two things this raises</h4>
  <ul>
    <li>Blocks are now the only mechanism, so <b>the defaults matter more</b>.
      Every leg opens as not-used / sail / not-used using round 4's 25 s and 10 s
      trims — which is what keeps mixed-sail legs at 0/20. If the default were
      "one block, all used", detection error would leak into the polars.</li>
    <li>A block shorter than about 15 s can't hold a bin (8 samples minimum),
      so it silently contributes nothing. It should probably say so.</li>
  </ul>
  <p class="muted">Same 2-hour windward-leeward nmea-sim race, 7,035 rows through
  ticket 05's row shape, legs from median |TWA| (14/14 roundings, 0 spurious,
  median error 33 s).</p>`;

/* ============================================================ render */
function render(){
  $('screen').innerHTML = S.view==='leg' ? renderLeg() : renderReview();
  $('caption').innerHTML = CAPTION();
  $('counts').textContent = `${LEGS.length} legs · ${totalPoints()} points`;
  wireBand();
}

/* drag the band: move whichever divider is nearest the finger */
function wireBand(){
  const el = $('band'); if (!el) return;
  const i = +el.dataset.i, l = L(i);
  const at = e => {
    const r = el.getBoundingClientRect();
    const px = clamp((e.clientX ?? 0) - r.left, 0, W-28);
    return Math.round(l.from + (px/(W-28))*l.dur);
  };
  let k = null;
  el.addEventListener('pointerdown', e => {
    const t = at(e), spans = st(i).spans;
    k = null; let bd = Infinity;
    for (let j=1;j<spans.length;j++){ const d=Math.abs(spans[j].from-t); if (d<bd){bd=d;k=j;} }
    if (k===null || bd > l.dur*0.12) { k = null; return; }   // not near a divider: let the tap select
    el.setPointerCapture(e.pointerId);
    const move = ev => {
      const spans = st(i).spans;
      const lo = spans[k-1].from + MINSPAN;
      const hi = (k+1<spans.length ? spans[k+1].from : l.to) - MINSPAN;
      spans[k].from = clamp(at(ev), lo, hi);
      S.sel = k; render();
    };
    const up = () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); render(); };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
  });
}

/* ============================================================ actions */
$('screen').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, i = S.i, s = st(i), l = L(i);
  const k = Math.min(S.sel, s.spans.length-1);
  switch (a){
    case 'prev': S.i = Math.max(0,i-1); S.sel = 1; break;
    case 'next': S.i = Math.min(LEGS.length-1,i+1); S.sel = 1; break;
    case 'mapToggle': S.mapFocus = !S.mapFocus; break;
    case 'selSpan': S.sel = +el.dataset.k; break;
    case 'toggleUse': s.use = !s.use; break;
    case 'setSail': s.spans[k].sail = el.dataset.sail || null; break;
    case 'carry': s.spans[k].sail = prevSail(i); break;
    case 'edge': {
      const d = +el.dataset.d;
      if (el.dataset.edge === 'from'){
        if (k === 0) break;
        const lo = s.spans[k-1].from + MINSPAN;
        const hi = spanEnd(i,k) - MINSPAN;
        s.spans[k].from = clamp(s.spans[k].from + d, lo, hi);
      } else {
        if (k === s.spans.length-1) break;
        const lo = s.spans[k].from + MINSPAN;
        const hi = (k+2 < s.spans.length ? s.spans[k+2].from : l.to) - MINSPAN;
        s.spans[k+1].from = clamp(s.spans[k+1].from + d, lo, hi);
      }
      break;
    }
    case 'split': {
      const a0 = s.spans[k].from, b0 = spanEnd(i,k);
      if (b0 - a0 < MINSPAN*2) break;
      s.spans.splice(k+1, 0, { from: Math.round((a0+b0)/2), sail: s.spans[k].sail });
      S.sel = k+1;
      break;
    }
    case 'merge': {
      if (k === 0) break;
      s.spans.splice(k, 1);
      S.sel = Math.max(0, k-1);
      break;
    }
    case 'review': S.view = 'review'; break;
    case 'backToLegs': S.view = 'leg'; break;
    case 'commit': alert(`${totalPoints()} points written, tagged to this session. Nothing is persisted in the prototype.`); break;
  }
  render();
});

document.querySelector('.harness').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.truth) S.truth = b.dataset.truth==='on';
  if (b.dataset.course) S.course = b.dataset.course==='on';
  if (b.dataset.mode) document.documentElement.dataset.mode = b.dataset.mode;
  if (b.id==='btnReset'){ S.i=0; S.sel=1; S.view='leg';
    S.legs = LEGS.map(l=>({ use:true, spans: defaultSpans(l) })); }
  document.querySelectorAll('.harness button').forEach(x=>{
    if (x.dataset.truth)  x.classList.toggle('on',(x.dataset.truth==='on')===S.truth);
    if (x.dataset.course) x.classList.toggle('on',(x.dataset.course==='on')===S.course);
    if (x.dataset.mode)   x.classList.toggle('on', x.dataset.mode===document.documentElement.dataset.mode);
  });
  render();
});

addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (S.view!=='leg') return;
  if (e.key==='ArrowLeft'){ S.i=Math.max(0,S.i-1); S.sel=1; render(); }
  if (e.key==='ArrowRight'){ S.i=Math.min(LEGS.length-1,S.i+1); S.sel=1; render(); }
});
setInterval(()=>{ const d=new Date();
  $('clock').textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; },1000);
document.documentElement.dataset.mode='night';
render();
</script>
</body>
</html>
