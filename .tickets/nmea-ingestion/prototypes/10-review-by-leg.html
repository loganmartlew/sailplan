<title>PROTOTYPE — 10 review by leg</title>
<!--
  THROWAWAY PROTOTYPE for .tickets/nmea-ingestion/issues/10-review-and-promotion-screen.md
  Round 3. Rounds 1 and 2 (three takes each on tape / inbox / polar) were
  rejected: too complex, user-unfriendly. Logan's reframing:

    "frame things locationally — on a map, or mapping points to legs of the
     race. Go leg by leg, assign sails to a whole or part of a leg, trim off
     the start and end for hoist/drop, and derive a few stable points from
     what's left."

  That is a better frame, and the data agrees. THE LEG IS THE UNIT OF REVIEW.
  You make 17 judgements, not 118, and each is one a sailor can actually make:
  "that was the beat to the top mark, on the J1, ignore the first 25 seconds."

  Three variants of leg-by-leg, switchable via ?variant=A|B|C, the floating bar,
  and the arrow keys:
    A "One leg at a time" — a wizard. One leg fills the screen, you answer it,
                            you go to the next. Nothing else is visible.
    B "The chart"         — the race track is the primary object. Legs are
                            segments on it; tap one, trim it in place.
    C "The log"           — all 17 legs as a list, like a race log. Everything
                            visible at once, expand a row to work it.

  LEG DETECTION IS REAL, and measured against the simulator's ground truth
  (which knows exactly when the boat was manoeuvring and which sail was up):

    rule: over a +/-20 s window, a leg boundary is a heading change >= 45 deg,
          a TWA sign flip (tack/gybe), or a TWA magnitude change >= 12 deg.
          Minimum leg 60 s. Data gaps are boundaries too.

    result on this race: 17 legs · ZERO legs containing more than one sail ·
                         ZERO manoeuvre seconds inside a leg · 79% of the race
                         is inside some leg · 188 derived points, median 10/leg.

  Chosen from a 36-point parameter sweep; a tack-sized threshold alone merged
  the whole downwind wardrobe into one 1,100 s blob with 68 deg of TWA spread,
  because a kite peel turns the boat 22-30 deg, not 90.

  The data underneath is the same real two-hour nmea-sim race reduced through
  ticket 05's row shape (7,035 rows). Sail stamps are ticket 09's model and are
  wrong in the three ways a human gets them wrong; the harness can show what the
  boat was ACTUALLY flying, which the real app never knows.
-->

/* ============================================================
   helpers
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const W = 336;
const LEGS = DATA.legs;
const SAIL_COLORS = { J1:'#3b82f6', A6:'#f97316', A5:'#eab308', A3:'#a855f7',
                      A2:'#ec4899', S1:'#14b8a6', 'S1.5':'#84cc16' };
const ALL_SAILS = ['J1','A6','A5','A3','A2','S1'];
const col = s => SAIL_COLORS[s] || '#64748b';
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lin = (d0,d1,r0,r1) => v => r0 + ((v-d0)/((d1-d0)||1))*(r1-r0);
const median = xs => { const s=[...xs].sort((a,b)=>a-b), m=s.length>>1;
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
const pctl = (xs,p) => { const s=[...xs].sort((a,b)=>a-b);
  return s[Math.min(s.length-1, Math.floor(p*s.length))]; };
const mmss = sec => `${Math.floor(sec/60)}m ${String(Math.round(sec)%60).padStart(2,'0')}s`;
const clock = sec => `${Math.floor(sec/3600)}:${String(Math.floor((sec%3600)/60)).padStart(2,'0')}:${String(Math.round(sec)%60).padStart(2,'0')}`;

/* ============================================================
   state — one entry per leg. This IS the review.
   ============================================================ */
const S = {
  variant: 'A',
  cursor: 0,                 // variant A's current leg
  open: null,                // variants B/C's expanded leg
  truth: false,
  legs: LEGS.map(l => ({
    sail: l.claimed,         // what we think was up — a stamp, or nothing
    head: l.trim[0], tail: l.trim[1],
    state: l.claimed ? 'todo' : 'todo',   // todo | kept | dropped
  })),
};
const st = i => S.legs[i];

/* recompute a leg's points at the current trim — this is the whole promotion
   rule, and it is cheap enough to run on every drag */
function pointsFor(i){
  const s = st(i), l = LEGS[i], rows = DATA.legSeries[i];
  const from = l.from + s.head, to = l.to - s.tail;
  const bins = new Map();
  for (const r of rows){
    if (r[0] < from || r[0] > to) continue;
    if (r[1] === null || r[2] === null || r[3] === null) continue;
    const k = `${Math.round(r[2])}|${Math.round(Math.abs(r[3])/4)*4}`;
    if (!bins.has(k)) bins.set(k, []);
    bins.get(k).push(r[1]);
  }
  const out = [];
  for (const [k,v] of bins){
    if (v.length < 8) continue;
    const [tws,twa] = k.split('|').map(Number);
    out.push({ tws, twa, speed:+median(v).toFixed(2), n:v.length,
               sp:[+pctl(v,.1).toFixed(2), +pctl(v,.9).toFixed(2)] });
  }
  return out.sort((a,b)=>a.twa-b.twa || a.tws-b.tws);
}

const kept = () => S.legs.filter(l => l.state === 'kept');
const totalPoints = () => S.legs.reduce((a,l,i) => a + (l.state==='kept' ? pointsFor(i).length : 0), 0);
const decided = () => S.legs.filter(l => l.state !== 'todo').length;

/* the previous leg's sail — "you don't re-declare the sail when you tack" */
const prevSail = i => { for (let k=i-1;k>=0;k--) if (S.legs[k].sail) return S.legs[k].sail; return null; };

/* ============================================================
   drawing
   ============================================================ */
/* a leg's own track, fitted to a box — the locational framing */
function legMap(i, w, h, opts={}){
  const l = LEGS[i], s = st(i);
  const pts = l.track;
  if (pts.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const spanX = Math.max(...xs)-Math.min(...xs), spanY = Math.max(...ys)-Math.min(...ys);
  const span = Math.max(spanX, spanY, 50);
  const cx = (Math.min(...xs)+Math.max(...xs))/2, cy = (Math.min(...ys)+Math.max(...ys))/2;
  const x = lin(cx-span/2, cx+span/2, 12, w-12);
  const y = lin(cy-span/2, cy+span/2, h-12, 12);
  const from = l.from + s.head, to = l.to - s.tail;

  const seg = (filter, stroke, width) => {
    let d = '', pen = false;
    for (const p of pts){
      if (!filter(p[2])) { pen = false; continue; }
      d += `${pen?'L':'M'}${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)} `; pen = true;
    }
    return d ? `<path d="${d}" stroke="${stroke}" stroke-width="${width}" fill="none" stroke-linecap="round"/>` : '';
  };
  const a = pts[0], b = pts[pts.length-1];
  return `<svg width="${w}" height="${h}">
    <rect x="0" y="0" width="${w}" height="${h}" rx="12" fill="var(--panel)"/>
    ${seg(t => t < from, 'var(--line)', 5)}
    ${seg(t => t > to,   'var(--line)', 5)}
    ${seg(t => t >= from && t <= to, opts.color || 'var(--accent)', 5)}
    <circle cx="${x(a[0])}" cy="${y(a[1])}" r="4" fill="var(--dim)"/>
    <circle cx="${x(b[0])}" cy="${y(b[1])}" r="4" fill="var(--dim)"/>
    ${opts.label ? `<text x="12" y="${h-10}" font-size="10" fill="var(--dim)">${opts.label}</text>` : ''}
  </svg>`;
}

/* the leg's boat-speed trace with the trimmed ends greyed — this is what makes
   "trim the hoist off the front" a thing you can see rather than guess */
function legTrace(i, w, h){
  const l = LEGS[i], s = st(i), rows = DATA.legSeries[i];
  const x = lin(l.from, l.to, 0, w);
  const sp = rows.map(r=>r[1]).filter(v=>v!==null);
  const y = lin(0, Math.max(12, Math.max(...sp)*1.15), h-6, 6);
  const stride = Math.max(1, Math.floor(rows.length/(w*2)));
  let d = '', pen = false;
  for (let k=0;k<rows.length;k+=stride){
    const r = rows[k];
    if (r[1] === null) { pen = false; continue; }
    d += `${pen?'L':'M'}${x(r[0]).toFixed(1)} ${y(r[1]).toFixed(1)} `; pen = true;
  }
  const hx = x(l.from + s.head), tx = x(l.to - s.tail);
  return `<svg width="${w}" height="${h}" id="trace-${i}">
    <rect x="0" y="0" width="${w}" height="${h}" rx="8" fill="var(--panel)"/>
    <rect x="0" y="0" width="${hx}" height="${h}" fill="rgba(239,68,68,.13)"/>
    <rect x="${tx}" y="0" width="${w-tx}" height="${h}" fill="rgba(239,68,68,.13)"/>
    <path d="${d}" stroke="var(--fg)" stroke-width="1.4" fill="none"/>
    <line x1="${hx}" y1="0" x2="${hx}" y2="${h}" stroke="var(--accent)" stroke-width="2"/>
    <line x1="${tx}" y1="0" x2="${tx}" y2="${h}" stroke="var(--accent)" stroke-width="2"/>
  </svg>`;
}

/* what this leg would add to the polar, against what you already have */
function pointsBar(i){
  const pts = pointsFor(i), l = LEGS[i], s = st(i);
  if (!pts.length) return `<div class="xs muted">No point survives the trim — the bins are too thin.</div>`;
  const ex = (DATA.existing[s.sail] || []);
  const nearest = p => {
    let best = null, bd = Infinity;
    for (const q of ex){ const dd = (q.tws-p.tws)**2 + ((q.twa-p.twa)*0.25)**2; if (dd<bd){bd=dd;best=q;} }
    return bd > 36 ? null : best.speed;
  };
  const w = 300, h = 74;
  const twas = pts.map(p=>p.twa), sps = pts.map(p=>p.speed);
  const exsp = pts.map(nearest).filter(v=>v!==null);
  const lo = Math.min(...sps, ...exsp, 99) * 0.9, hi = Math.max(...sps, ...exsp, 0) * 1.06;
  const x = lin(Math.min(...twas)-3, Math.max(...twas)+3, 26, w-8);
  const y = lin(lo, hi, h-16, 8);
  return `<svg width="${w}" height="${h}">
    ${pts.map(p => { const e = nearest(p); return e===null ? '' :
      `<line x1="${x(p.twa)}" y1="${y(p.speed)}" x2="${x(p.twa)}" y2="${y(e)}" stroke="var(--line)" stroke-width="2"/>
       <circle cx="${x(p.twa)}" cy="${y(e)}" r="3" fill="var(--dim)"/>`; }).join('')}
    ${pts.map(p => `<circle cx="${x(p.twa)}" cy="${y(p.speed)}" r="4" fill="var(--accent)"/>`).join('')}
    <text x="2" y="12" font-size="9" fill="var(--dim)">kn</text>
    <text x="26" y="${h-3}" font-size="9" fill="var(--dim)">${Math.min(...twas)}°</text>
    <text x="${w-30}" y="${h-3}" font-size="9" fill="var(--dim)">${Math.max(...twas)}°</text>
  </svg>
  <div class="xs muted">blue = this leg · grey = your table</div>`;
}

/* the sail picker, with "same as the last leg" first, because 5 of 17 legs on

function sailPicker(i){

function trimControls(i){

  const i = S.cursor;
  if (i >= LEGS.length) return renderDone();
  const l = LEGS[i], s = st(i), pts = pointsFor(i);

  return `<div class="pad" style="padding-bottom:26px">
    <div class="row">
      <span class="xs muted grow">Leg ${i+1} of ${LEGS.length} · ${clock(l.from)}</span>
      <span class="xs muted">${decided()} done</span>
    </div>
    <div class="dots" style="margin:6px 0 12px">
      ${S.legs.map((x,k)=>`<span class="dot ${k===i?'now':x.state==='kept'?'done':x.state==='dropped'?'skip':''}"></span>`).join('')}
    </div>

    <div class="row">
      <span class="h1 grow">${l.kind}</span>
      ${truthBadge(i)}
    </div>
    <div class="sm muted" style="margin-bottom:12px">
      ${mmss(l.dur)} · TWA ${l.twa}° ${l.tack} · TWS ${l.tws} kn · ${l.speed} kn
    </div>

    ${legMap(i, W-28, 210, { color: col(s.sail) })}

    <div class="sm" style="margin:16px 0 8px;font-weight:600">Which sail?</div>
    ${s.sail ? '' : `<div class="xs" style="color:var(--warn);margin-bottom:6px">
      Nothing was stamped on this leg.</div>`}
    ${sailPicker(i)}

    <div class="sm" style="margin:18px 0 8px;font-weight:600">Trim the ends</div>
    <div class="xs muted" style="margin-bottom:8px">Hoist, drop, and getting back up to speed.</div>
    ${legTrace(i, W-28, 60)}
    <div style="margin-top:8px">${trimControls(i)}</div>

    <div class="card" style="margin-top:18px">
      <div class="row">
        <span class="h1 grow" style="font-size:20px">${pts.length} point${pts.length===1?'':'s'}</span>
        <span class="xs muted">${s.sail ? `for ${s.sail}` : 'no sail chosen'}</span>
      </div>
      <div style="margin-top:6px">${pointsBar(i)}</div>
    </div>

    <div class="row" style="gap:8px;margin-top:16px">
      <button class="btn" data-act="drop" data-i="${i}">Skip leg</button>
      <button class="btn primary big grow" data-act="keep" data-i="${i}" ${s.sail?'':'disabled'}>
        ${s.sail ? `Keep ${pts.length} →` : 'Pick a sail'}</button>
    </div>
    ${i>0?`<button class="btn sm" style="margin-top:10px" data-act="back">‹ Previous leg</button>`:''}
  </div>`;
}

function renderDone(){
  const k = kept(), n = totalPoints();
  return `<div class="pad" style="padding-top:40px;text-align:center">
    <div class="h1">${n} points</div>
    <div class="sm muted" style="margin:6px 0 20px">
      from ${k.length} of ${LEGS.length} legs</div>
    ${Object.entries(k.reduce((a,l)=>{a[l.sail]=(a[l.sail]||0)+1;return a;},{}))
      .map(([sail,c]) => `<div class="row card" style="margin-bottom:6px">
        <span class="swatch" style="width:10px;height:24px;border-radius:3px;background:${col(sail)}"></span>
        <span class="grow" style="text-align:left">${sail}</span>
        <span class="xs muted">${c} leg${c===1?'':'s'}</span>
      </div>`).join('')}
    <button class="btn primary big" style="width:100%;margin-top:16px" data-act="commit">Add them to my polars</button>
    <button class="btn sm" style="margin-top:10px" data-act="restart">Start over</button>
  </div>`;
}

/* ============================================================
   VARIANT B — the chart. The race track is the primary object.
   The bet: "locationally" means literally — you recognise the beat by its
   shape on the water, not by a row in a list.
   ============================================================ */
function renderB(){
  const w = W-28, h = 400;
  const all = DATA.wholeTrack;
  const xs = all.map(p=>p[0]), ys = all.map(p=>p[1]);
  const spanX = Math.max(...xs)-Math.min(...xs), spanY = Math.max(...ys)-Math.min(...ys);
  const span = Math.max(spanX, spanY);
  const cx = (Math.min(...xs)+Math.max(...xs))/2, cy = (Math.min(...ys)+Math.max(...ys))/2;
  const X = lin(cx-span/2, cx+span/2, 14, w-14);
  const Y = lin(cy-span/2, cy+span/2, h-14, 14);

  const legPath = (i) => {
    const l = LEGS[i], s = st(i);
    const from = l.from + s.head, to = l.to - s.tail;
    let d = '', pen = false;
    for (const p of l.track){
      if (p[2] < from || p[2] > to){ pen = false; continue; }
      d += `${pen?'L':'M'}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)} `; pen = true;
    }
    return d;
  };
  let base = '';
  for (let k=0;k<all.length;k++){
    base += `${k?'L':'M'}${X(all[k][0]).toFixed(1)} ${Y(all[k][1]).toFixed(1)} `;
  }
  const open = S.open;

  return `<div class="pad" style="padding-bottom:${open!==null?300:20}px">
    <div class="row">
      <span class="grow"><span class="h1" style="font-size:19px">${esc(DATA.session.name)}</span></span>
      <span class="xs muted">${totalPoints()} pts</span>
    </div>
    <div class="xs muted" style="margin-bottom:10px">
      ${LEGS.length} legs · tap one. Grey = manoeuvres and trimmed ends.</div>

    <svg width="${w}" height="${h}">
      <rect x="0" y="0" width="${w}" height="${h}" rx="14" fill="var(--panel)"/>
      <path d="${base}" stroke="var(--line)" stroke-width="6" fill="none" stroke-linecap="round"/>
      ${LEGS.map((l,i) => {
        const s = st(i);
        const c = s.state==='dropped' ? 'var(--line)' : s.sail ? col(s.sail) : 'var(--warn)';
        return `<path d="${legPath(i)}" stroke="${c}" stroke-width="${open===i?9:6}" fill="none"
                  stroke-linecap="round" opacity="${open===null||open===i?1:.45}"
                  style="cursor:pointer" data-act="openLeg" data-i="${i}"/>`;
      }).join('')}
      ${LEGS.map((l,i) => {
        const p = l.track[Math.floor(l.track.length/2)];
        if (!p) return '';
        return `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="10" fill="rgba(0,0,0,.35)"
                  style="cursor:pointer" data-act="openLeg" data-i="${i}"/>
                <text x="${X(p[0])}" y="${Y(p[1])+3.5}" font-size="10" font-weight="700"
                  text-anchor="middle" fill="#fff" style="pointer-events:none">${i+1}</text>`;
      }).join('')}
    </svg>

    <div class="row" style="gap:5px;margin-top:10px;flex-wrap:wrap">
      ${[...new Set(S.legs.map(l=>l.sail).filter(Boolean))].map(s =>
        `<span class="chip" style="border-color:${col(s)}">
          <span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${col(s)}"></span> ${s}</span>`).join('')}
      ${S.legs.some(l=>!l.sail) ? `<span class="chip" style="border-color:var(--warn);color:var(--warn)">no sail</span>`:''}
    </div>
  </div>

  ${open === null ? '' : (() => {
    const l = LEGS[open], s = st(open), pts = pointsFor(open);
    return `<div style="position:absolute;left:0;right:0;bottom:0;background:var(--panel);
      border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px;max-height:62%;overflow-y:auto">
      <div class="row">
        <span class="h1 grow" style="font-size:19px">${open+1}. ${l.kind}</span>
        ${truthBadge(open)}
        <button class="btn sm" data-act="closeLeg">✕</button>
      </div>
      <div class="xs muted" style="margin-bottom:10px">
        ${clock(l.from)} · ${mmss(l.dur)} · TWA ${l.twa}° ${l.tack} · TWS ${l.tws} kn</div>
      ${sailPicker(open)}
      <div style="margin-top:12px">${legTrace(open, W-56, 52)}</div>
      <div style="margin-top:8px">${trimControls(open)}</div>
      <div class="row" style="margin-top:12px">
        <span class="grow sm" style="font-weight:600">${pts.length} points</span>
        <button class="btn sm" data-act="drop" data-i="${open}">Skip</button>
        <button class="btn primary sm" data-act="keepStay" data-i="${open}" ${s.sail?'':'disabled'}>Keep</button>
      </div>
    </div>`;
  })()}`;
}

/* ============================================================
   VARIANT C — the log. Everything at once.
   The bet: 17 rows is small enough to just show, and a race log is a document
   a sailor already knows how to read.
   ============================================================ */
function renderC(){
  const unclaimed = S.legs.filter(l=>!l.sail).length;
  return `<div class="pad" style="padding-bottom:100px">
    <div class="row">
      <span class="h1 grow" style="font-size:19px">Race log</span>
      <span class="xs muted">${totalPoints()} pts</span>
    </div>
    <div class="xs muted">${LEGS.length} legs · ${esc(DATA.session.name)}</div>

    ${unclaimed ? `<div class="card" style="margin-top:10px;border-color:var(--warn)">
      <div class="xs" style="color:var(--warn);font-weight:600">${unclaimed} legs have no sail</div>
      <div class="xs muted" style="margin:4px 0 8px">
        Every one is the leg straight after a tack — you don't re-announce the sail when you tack.</div>
      <button class="btn sm" data-act="fillDown">Carry the previous sail into all ${unclaimed}</button>
    </div>` : ''}

    <div style="margin-top:8px">
    ${LEGS.map((l,i) => {
      const s = st(i), open = S.open === i, pts = pointsFor(i);
      return `<div class="legrow" data-act="toggleLeg" data-i="${i}">
        <div class="row">
          <span style="width:22px" class="xs muted">${i+1}</span>
          <span class="swatch" style="width:4px;height:26px;border-radius:2px;background:${s.sail?col(s.sail):'var(--warn)'}"></span>
          <span class="grow">
            <div class="sm" style="font-weight:600">${l.kind}
              <span class="muted" style="font-weight:400">· ${l.twa}° ${l.tack}</span></div>
            <div class="xs muted">${mmss(l.dur)} · ${l.tws} kn · ${l.speed} kn</div>
          </span>
          <span style="text-align:right">
            <div class="sm">${s.sail ?? '—'} ${truthBadge(i)}</div>
            <div class="xs muted">${s.state==='dropped'?'skipped':pts.length+' pts'}</div>
          </span>
        </div>
        ${open ? `<div style="padding:12px 0 4px" data-act="noop">
          ${legMap(i, W-28, 150, { color: col(s.sail) })}
          <div style="margin-top:10px">${sailPicker(i)}</div>
          <div style="margin-top:12px">${legTrace(i, W-28, 48)}</div>
          <div style="margin-top:8px">${trimControls(i)}</div>
          <div class="row" style="margin-top:10px">
            <span class="grow xs muted">${pts.length} points${s.sail?' for '+s.sail:''}</span>
            <button class="btn sm" data-act="drop" data-i="${i}">Skip</button>
            <button class="btn primary sm" data-act="keepStay" data-i="${i}" ${s.sail?'':'disabled'}>Keep</button>
          </div>
        </div>` : ''}
      </div>`;
    }).join('')}
    </div>
  </div>
  <div style="position:absolute;left:14px;right:14px;bottom:14px">
    <button class="btn primary big" style="width:100%" data-act="commit">
      Add ${totalPoints()} points to my polars</button>
  </div>`;
}

/* ============================================================
   captions
   ============================================================ */
const CAPTIONS = {
  A: `<h3>A — One leg at a time</h3>
   <p><b>A wizard.</b> The screen only ever asks one question: <i>this leg —
   which sail, and where does it start and stop?</i> Everything else is hidden.
   17 screens, then a summary.</p>
   <h4>What to try</h4>
   <ul>
     <li>Answer leg 1 and hit Keep. <span class="q">Is one-at-a-time relief, or
       is 17 screens a slog?</span></li>
     <li>Leg 2 has <b>no sail stamped</b> — note "Same as last leg" comes first.</li>
     <li>Trim the start and watch the point count change live.</li>
   </ul>
   <h4>Where it's weak</h4>
   <ul>
     <li class="bad">No sense of the whole race. You can't tell leg 8 from leg 15.</li>
     <li class="bad">No way to fix a leg you already passed except walking back.</li>
   </ul>`,
  B: `<h3>B — The chart</h3>
   <p><b>The track is the primary object</b> — the most literal reading of
   "frame things locationally". Legs are coloured segments of the course;
   grey is what was thrown away. You recognise a leg by its shape.</p>
   <h4>What to try</h4>
   <ul>
     <li>Tap a numbered leg. Assign, trim, keep, close, next.</li>
     <li>Watch the grey grow as you trim — <span class="q">the discarded part of
       the race is visible, which no other variant manages.</span></li>
     <li>Colour is sail: amber legs have none.</li>
   </ul>
   <h4>Where it's weak</h4>
   <ul>
     <li class="bad">This course is a windward-leeward, so it overlaps itself
       badly — legs 1, 8 and 15 sit on top of each other. A real harbour race
       would be worse.</li>
     <li class="bad">A leg's <i>time</i> is invisible: two laps of the same
       course look identical.</li>
   </ul>`,
  C: `<h3>C — The log</h3>
   <p><b>All 17 legs at once</b>, as a race log — a document a sailor already
   knows how to read. Tap a row to work it in place; nothing navigates away.</p>
   <h4>What to try</h4>
   <ul>
     <li>Scan the column of sails for the gaps, then hit <b>Carry the previous
       sail into all 5</b>. <span class="q">One tap fixes every forgotten
       stamp.</span></li>
     <li>Expand a row: map, sails, trim, points, all inline.</li>
   </ul>
   <h4>Where it's weak</h4>
   <ul>
     <li class="bad">The rows look alike — "Beat · 47° port" three times over is
       the same problem the chart has, moved.</li>
     <li>Least locational of the three: the map is demoted to a thumbnail.</li>
   </ul>`,
};

const COMMON = `
  <h4 style="margin-top:22px">Why the leg is the right unit</h4>
  <p>Rounds 1–2 asked you to judge <b>118 proposals</b>. This asks you to judge
  <b>17 legs</b>, and derives the points. The detection rule is real and scored
  against the simulator's ground truth:</p>
  <table>
    <tr><td>legs detected</td><td><b>17</b></td></tr>
    <tr><td>legs containing more than one sail</td><td><b>0</b></td></tr>
    <tr><td>manoeuvre seconds inside a leg</td><td><b>0</b></td></tr>
    <tr><td>race covered by some leg</td><td><b>79%</b></td></tr>
    <tr><td>points derived</td><td><b>188</b> (median 10/leg)</td></tr>
  </table>
  <p>Rule: over a ±20 s window, a boundary is a heading change ≥45°, a TWA sign
  flip, or a TWA magnitude change ≥12°; minimum leg 60 s; data gaps are
  boundaries. Chosen from a 36-point sweep — a tack-sized threshold alone merged
  the whole downwind wardrobe into one 1,100 s blob.</p>
  <h4>Two things the framing exposed</h4>
  <ul>
    <li><b>5 of 17 legs have no sail stamped</b>, and every one is the leg
    straight after a tack. <span class="q">You don't re-announce the sail when
    you tack</span> — so ticket 19's attribution rule must carry a stamp across a
    manoeuvre, not stop at it.</li>
    <li class="bad"><b>Leg 5's stamp is wrong.</b> It reads A2; the boat was on
    the A5. The peel was tapped 70 s early, so it landed in the previous leg.
    Turn on <b>show actual sail</b> in the harness. This is exactly the silent
    misattribution ticket 19 forbids — and the leg framing is what makes it
    visible, because leg 5 is the one leg whose numbers don't fit its sail.</li>
  </ul>
  <p class="muted">Same real two-hour nmea-sim race, reduced through ticket 05's
  row shape: 7,035 rows. Trim defaults 25 s off the front, 10 s off the back.</p>`;

/* ============================================================
   render + actions
   ============================================================ */
function render(){
  $('screen').innerHTML =
    S.variant === 'A' ? renderA() : S.variant === 'B' ? renderB() : renderC();
  $('vlabel').textContent = `${S.variant} — ${{A:'One leg at a time',B:'The chart',C:'The log'}[S.variant]}`;
  $('caption').innerHTML = CAPTIONS[S.variant] + COMMON;
  $('counts').textContent =
    `${LEGS.length} legs · ${decided()} decided · ${totalPoints()} points`;
}

$('screen').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, i = +el.dataset.i;
  switch (a){
    case 'sail': st(i).sail = el.dataset.sail; break;
    case 'trim': {
      const end = el.dataset.end, d = +el.dataset.d, l = LEGS[i], s = st(i);
      const next = clamp(s[end] + d, 0, l.dur - 30 - (end==='head'?s.tail:s.head));
      s[end] = next; break;
    }
    case 'keep': st(i).state = 'kept'; S.cursor = i+1; break;
    case 'keepStay': st(i).state = 'kept'; S.open = null; break;
    case 'drop': st(i).state = 'dropped'; if (S.variant==='A') S.cursor = i+1; else S.open = null; break;
    case 'back': S.cursor = Math.max(0, S.cursor-1); break;
    case 'restart': S.cursor = 0; S.legs.forEach((l,k) => { l.state='todo'; l.sail = LEGS[k].claimed; }); break;
    case 'commit': alert(`${totalPoints()} points would be written, tagged to this session so the whole lot can be taken back out. Nothing is persisted in the prototype.`); break;
    case 'openLeg': S.open = i; break;
    case 'closeLeg': S.open = null; break;
    case 'toggleLeg': S.open = S.open === i ? null : i; break;
    case 'fillDown': S.legs.forEach((l,k) => { if (!l.sail) l.sail = prevSail(k); }); break;
    case 'noop': return;
  }
  render();
});

document.querySelector('.harness').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.truth) S.truth = b.dataset.truth === 'on';
  if (b.dataset.mode) document.documentElement.dataset.mode = b.dataset.mode;
  if (b.id === 'btnReset'){ S.cursor = 0; S.open = null;
    S.legs.forEach((l,k) => { l.state='todo'; l.sail = LEGS[k].claimed; l.head = LEGS[k].trim[0]; l.tail = LEGS[k].trim[1]; }); }
  document.querySelectorAll('.harness button').forEach(x => {
    if (x.dataset.truth) x.classList.toggle('on', (x.dataset.truth==='on') === S.truth);
    if (x.dataset.mode)  x.classList.toggle('on', x.dataset.mode === document.documentElement.dataset.mode);
  });
  render();
});

function setVariant(v){
  S.variant = v; S.open = null;
  const u = new URL(location); u.searchParams.set('variant', v);
  history.replaceState(null, '', u);
  render();
}
const keys = ['A','B','C'];
$('prev').onclick = () => setVariant(keys[(keys.indexOf(S.variant)+2)%3]);
$('next').onclick = () => setVariant(keys[(keys.indexOf(S.variant)+1)%3]);
addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft')  $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
});

setInterval(() => {
  const d = new Date();
  $('clock').textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}, 1000);

S.variant = new URL(location).searchParams.get('variant') || 'A';
if (!keys.includes(S.variant)) S.variant = 'A';
document.documentElement.dataset.mode = 'night';
render();
</script>
</body>
</html>
