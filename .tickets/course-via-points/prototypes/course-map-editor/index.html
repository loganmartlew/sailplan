<!doctype html>
<!--
  THROWAWAY PROTOTYPE — Course Map/editor interaction.
  Three variants, switchable with ?variant=map|story|segment.
  Serve from the repository root:
    python3 -m http.server 8000
  Then open:
    http://localhost:8000/.tickets/course-via-points/prototypes/course-map-editor-prototype.html
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prototype — Course Map editor</title>
  <style>
    :root { --ink:#12212d; --muted:#687783; --line:#d9e1e6; --sea:#066b80; --deep:#073c4c; --foam:#eaf8f8; --orange:#e85f27; --yellow:#f6c453; --paper:#f8fafb; --green:#0d875a; }
    * { box-sizing:border-box; } body { margin:0; background:#dce5e9; color:var(--ink); font:14px/1.35 ui-rounded, "Avenir Next", Inter, system-ui, sans-serif; }
    button, input, select { font:inherit; } button { border:0; cursor:pointer; } button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid #73d7e7; outline-offset:2px; }
    #app { width:min(100%,430px); min-height:100vh; margin:auto; background:var(--paper); box-shadow:0 0 48px #2d3b4144; padding-bottom:100px; }
    .notice { padding:8px 16px; background:#fff4d8; color:#755300; font-size:12px; text-align:center; }
    .topbar { display:flex; align-items:center; gap:10px; padding:15px 16px 12px; background:white; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:4; }
    .back { width:30px; height:30px; background:#edf3f5; border-radius:50%; font-size:20px; } .eyebrow { color:var(--sea); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; } h1,h2,h3,p { margin:0; } h1 { font-size:18px; } h2 { font-size:16px; } h3 { font-size:14px; }
    .topbar .mode { margin-left:auto; padding:7px 10px; border-radius:999px; font-size:12px; font-weight:800; background:var(--foam); color:var(--sea); }
    .screen { padding:14px; } .card { background:white; border:1px solid var(--line); border-radius:16px; padding:13px; box-shadow:0 2px 7px #18313b0a; }
    .stack { display:grid; gap:10px; } .row { display:flex; align-items:center; gap:8px; } .between { justify-content:space-between; } .muted { color:var(--muted); } .tiny { font-size:11px; } .strong { font-weight:800; }
    .scenario { display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; margin:12px 14px 0; padding:10px 12px; border:1px solid #c6dce2; border-radius:12px; background:#f2fbfc; }
    select { min-width:160px; padding:7px; border:1px solid #b9cbd1; border-radius:8px; background:white; color:var(--ink); }
    .map { overflow:hidden; position:relative; padding:0; min-height:284px; background:#cde6eb; } .map svg { display:block; width:100%; height:284px; }
    .map.adding { outline:4px dashed var(--orange); outline-offset:-7px; cursor:crosshair; } .map-label { position:absolute; top:10px; left:10px; padding:5px 8px; border-radius:7px; background:#073c4ce8; color:white; font-size:11px; font-weight:800; }
    .land { fill:#e5d7b3; stroke:#c7b889; stroke-width:.6; } .waterline { fill:none; stroke:#9fc9d0; stroke-width:.6; } .route { fill:none; stroke:#0b5162; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; } .route.selected { stroke:var(--orange); stroke-width:3.2; }
    .route.overlap { stroke:#6e4da0; stroke-dasharray:2.5 1.6; } .mark { fill:white; stroke:#073c4c; stroke-width:1.1; } .via.local { fill:var(--orange); stroke:white; stroke-width:.9; } .via.saved { fill:#69459a; stroke:white; stroke-width:.9; } .node-text { fill:#16323c; font-size:4px; font-weight:800; paint-order:stroke; stroke:#fff; stroke-width:1px; }
    .select-line { cursor:pointer; } .select-line:hover { stroke:var(--orange); stroke-width:3px; }.legend { display:flex; gap:12px; flex-wrap:wrap; padding:9px 12px; border-top:1px solid var(--line); background:white; font-size:11px; }.dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:4px; }.dot.local{background:var(--orange)}.dot.saved{background:#69459a}.dot.mark{background:#fff;border:1px solid var(--ink)}
    .section-head { display:flex; align-items:center; justify-content:space-between; } .pill { padding:4px 7px; border-radius:999px; background:#edf3f5; color:#46606a; font-size:11px; font-weight:700; } .warning { background:#fff0e9; color:#a43c16; } .primary { background:var(--sea); color:white; padding:10px 12px; border-radius:9px; font-weight:800; } .secondary { background:#eaf2f4; color:#164657; padding:9px 10px; border-radius:9px; font-weight:800; } .danger { background:#fff0ed; color:#b23f20; padding:9px 10px; border-radius:9px; font-weight:800; }.compact { padding:6px 8px; font-size:12px; }
    .actions { display:flex; flex-wrap:wrap; gap:7px; }.actions > * { flex:1 1 auto; }.editbar { position:sticky; bottom:0; z-index:3; display:flex; gap:8px; padding:11px 14px; background:#fff; border-top:1px solid var(--line); box-shadow:0 -8px 18px #17313b12; }.editbar button{flex:1}.editbar .save{background:var(--green);color:#fff;padding:11px;border-radius:9px;font-weight:800}.editbar .cancel{background:#f0f3f4;color:#50616b;padding:11px;border-radius:9px;font-weight:800}
    .segment-row { display:grid; grid-template-columns:28px 1fr auto; gap:9px; align-items:center; padding:9px 0; border-top:1px solid #edf0f2; }.segment-row:first-of-type { border-top:0; }.seg-num { width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:#e8f2f4;color:var(--sea);font-size:11px;font-weight:800; }.segment-row.selected { margin:0 -7px; padding:9px 7px; border-radius:10px; background:#fff0e9; border-top:0; }.segment-row button { padding:5px 7px; background:white; border:1px solid #bacbd1; border-radius:7px; color:var(--deep); font-size:11px; font-weight:800; }
    .via-item { display:grid; grid-template-columns:10px 1fr auto; gap:8px; align-items:center; padding:8px 0 8px 19px; border-top:1px dashed #dce4e7; }.via-item.active { background:#fdf2eb; margin:0 -7px; padding-left:26px; padding-right:7px; }.via-name { border:1px solid #bbcdd3; border-radius:7px; padding:6px 7px; width:100%; }.locked { color:#69459a; font-size:11px; font-weight:800; }.mini-actions{display:flex;gap:4px}.mini-actions button{padding:4px 6px;background:#eef3f4;border-radius:6px;color:var(--deep)}
    .empty { padding:20px 10px; text-align:center; color:var(--muted); }.callout { border-left:4px solid var(--orange); padding:9px 10px; background:#fff7f2; border-radius:0 8px 8px 0; color:#6b3b29; font-size:12px; }.state { margin:14px; padding:12px; background:#102a34; color:#d9f4f6; border-radius:12px; overflow:auto; }.state summary { cursor:pointer; font-weight:800; }.state pre { margin:8px 0 0; font:10px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre-wrap; }
    .story-route { position:relative; padding-left:23px; }.story-route:before { content:""; position:absolute; left:8px; top:18px; bottom:18px; width:2px; background:#b9dce2; }.stop { position:relative; padding:9px 0; }.stop:before { content:""; position:absolute; left:-19px; top:16px; width:12px; height:12px; border-radius:50%; background:white; border:3px solid var(--sea); }.stop.end:before { border-radius:2px; background:var(--yellow); }.story-segment { margin:4px 0 4px -4px; padding:10px; border:1px solid var(--line); border-radius:11px; background:#fff; }.story-segment.selected { border:2px solid var(--orange); background:#fff8f4; }.story-segment .path { color:var(--sea); font-weight:800; font-size:12px; }
    .tabs { display:flex; gap:6px; overflow:auto; padding:0 14px 10px; }.tabs button { white-space:nowrap; padding:7px 9px; border-radius:8px; background:#e8f0f2; color:#3e5862; font-weight:800; font-size:12px; }.tabs button.active { background:var(--deep); color:#fff; }.inspector { border:2px solid #a9d5dd; }.inspector h2 { color:var(--deep); }.kv { display:grid; grid-template-columns:96px 1fr; gap:5px 10px; font-size:12px; }.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700}.route-chooser { display:flex; gap:6px; overflow:auto; padding:9px 0; }.route-chooser button { white-space:nowrap; padding:7px 9px; border-radius:8px; border:1px solid #c7d9dd; background:white; color:var(--deep); font-weight:800; font-size:11px; }.route-chooser button.selected { border-color:var(--orange); background:#fff0e9; color:#9a3919; }
    .switcher { position:fixed; z-index:10; left:50%; bottom:14px; transform:translateX(-50%); display:flex; align-items:center; gap:6px; padding:7px; border-radius:999px; background:#102a34; color:white; box-shadow:0 8px 30px #0006; }.switcher button { width:32px; height:32px; border-radius:50%; background:#264650; color:white; font-size:21px; }.switcher span { min-width:148px; text-align:center; font-size:12px; font-weight:800; }.toast { position:fixed; z-index:12; top:66px; left:50%; transform:translateX(-50%); padding:8px 11px; border-radius:9px; background:#123d48; color:#fff; box-shadow:0 3px 12px #0003; font-size:12px; font-weight:700; }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script>
    /* Three variants of the Course Map/editor, switchable via ?variant=. */
    const variants = [
      { key: 'map', name: 'A — Map-first editor' },
      { key: 'story', name: 'B — Route storyboard' },
      { key: 'segment', name: 'C — Segment inspector' },
    ];
    const scenarioTemplates = {
      none: { name:'No Via Points', note:'A simple three-mark course. Start from the ordinary case.', marks:[['Start',16,72],['Northern mark',73,22],['Finish',87,75]], vias:[] },
      headland: { name:'Headland detour', note:'One course-local point holds the intended route clear of the headland.', marks:[['Start',12,71],['Windward mark',82,23],['Finish',89,78]], vias:[['v1',0,'West of headland','local',44,32]] },
      channel: { name:'Multi-point channel', note:'Three ordered points in one Leg guide the sailor through a channel.', marks:[['Start',13,77],['Outer mark',85,23],['Finish',87,78]], vias:[['v1',0,'Channel entrance','local',34,64],['v2',0,'Green pile','mark',49,42],['v3',0,'Channel exit','local',66,34]] },
      overlap: { name:'Overlapping Legs', note:'Two Legs share geography. Select a named segment rather than guessing from a line.', marks:[['Start',14,73],['East mark',82,31],['West mark',24,24],['Finish',87,76]], vias:[['v1',0,'Keep north of shoal','local',47,46],['v2',1,'Return-channel beacon','mark',50,47]] },
    };
    let state = { scenario:'headland', variant:new URLSearchParams(location.search).get('variant') || 'map', editing:false, selected:{leg:0,index:0}, selectedVia:null, addMode:null, toast:'' };
    let saved = cloneScenario(state.scenario), draft = cloneScenario(state.scenario);
    function cloneScenario(key) { const x = scenarioTemplates[key]; return { key, name:x.name, note:x.note, marks:x.marks.map((m,i)=>({id:'m'+i,name:m[0],x:m[1],y:m[2]})), vias:x.vias.map(v=>({id:v[0],leg:v[1],name:v[2],source:v[3],x:v[4],y:v[5]})) }; }
    const model = () => state.editing ? draft : saved;
    function segments() { const c=model(), result=[]; for(let leg=0;leg<c.marks.length-1;leg++){ const nodes=[c.marks[leg],...c.vias.filter(v=>v.leg===leg),c.marks[leg+1]]; for(let i=0;i<nodes.length-1;i++) result.push({leg,index:i,from:nodes[i],to:nodes[i+1]}); } return result; }
    function segLabel(s) { return `${s.from.name} → ${s.to.name}`; }
    function selectedSeg() { return segments().find(s=>s.leg===state.selected.leg && s.index===state.selected.index) || segments()[0]; }
    function validSelection(){ const s=selectedSeg(); if(s) state.selected={leg:s.leg,index:s.index}; else state.selected={leg:0,index:0}; }
    function escape(s) { return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
    function pageHeader(title, subtitle) { return `<div class="notice">THROWAWAY UI PROTOTYPE — decisions only; no route is validated as navigable or safe.</div><header class="topbar"><button class="back" title="Back">‹</button><div><div class="eyebrow">Course map</div><h1>${title}</h1></div><span class="mode">${state.editing?'Editing draft':'Read-only'}</span></header><div class="scenario"><div><div class="strong">Scenario: ${escape(model().name)}</div><div class="tiny muted">${subtitle||model().note}</div></div><select id="scenarioSelect" aria-label="Prototype scenario">${Object.entries(scenarioTemplates).map(([key,x])=>`<option value="${key}" ${state.scenario===key?'selected':''}>${x.name}</option>`).join('')}</select></div>`; }
    function mapSvg(compact=false) { const c=model(), selected=selectedSeg(); const route=segments(); const y=compact?165:284; return `<div class="card map ${state.addMode?'adding':''}" id="mapSurface"><span class="map-label">${state.addMode ? 'Tap map to place new point on '+escape(segLabel(selected)) : (state.editing?'Tap a route segment to select it':'Route overview')}</span><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="Illustrative course map">
      <rect width="100" height="100" fill="#cde6eb"/><path class="land" d="M0,0 L31,0 C35,12 30,21 36,29 C40,38 35,48 42,56 C33,65 27,62 21,71 C15,84 23,95 19,100 L0,100Z"/><path class="land" d="M100,0 L82,0 C77,13 83,19 75,30 C70,36 74,48 68,57 C77,67 75,82 81,100 L100,100Z"/><path class="waterline" d="M3,16 C20,10 20,24 35,16 S55,21 68,14 S88,21 98,13"/><path class="waterline" d="M4,86 C19,77 33,88 44,77 S70,89 96,80"/>
      ${route.map((s,i)=>`<line class="route select-line ${s.leg===selected.leg&&s.index===selected.index?'selected':''} ${state.scenario==='overlap'&&s.leg===1?'overlap':''}" data-leg="${s.leg}" data-index="${s.index}" x1="${s.from.x}" y1="${s.from.y}" x2="${s.to.x}" y2="${s.to.y}"/>`).join('')}
      ${c.marks.map((m,i)=>`<g><rect class="mark" x="${m.x-2.2}" y="${m.y-2.2}" width="4.4" height="4.4" rx=".4"/><text class="node-text" x="${m.x+3}" y="${m.y-3}">${escape(m.name)}</text></g>`).join('')}
      ${c.vias.map(v=>`<g><circle class="via ${v.source==='mark'?'saved':'local'}" cx="${v.x}" cy="${v.y}" r="2.7"/><text class="node-text" x="${v.x+3}" y="${v.y-3}">${escape(v.name)}</text></g>`).join('')}
      ${state.scenario==='overlap'?'<text x="50" y="54" text-anchor="middle" class="node-text">overlap zone</text>':''}
    </svg><div class="legend"><span><i class="dot mark"></i>Course Mark</span><span><i class="dot local"></i>Course-local Via Point</span><span><i class="dot saved"></i>Saved Mark Via Point</span></div></div>`; }
    function segmentList() { const c=model(), ss=selectedSeg(), route=segments(); return `<div class="stack">${route.map((s,i)=>{ const vs=c.vias.filter(v=>v.leg===s.leg); const active=s.leg===ss.leg&&s.index===ss.index; return `<div class="segment-row ${active?'selected':''}"><div class="seg-num">${i+1}</div><div><div class="strong">${escape(segLabel(s))}</div><div class="tiny muted">Leg ${s.leg+1}${state.scenario==='overlap'?' · tap by name: overlapping route':''}</div></div><button data-select-segment="${s.leg}:${s.index}">${active?'Selected':'Select'}</button></div>`; }).join('')}</div>`; }
    function viaEditor(v) {
      const isActive=state.selectedVia===v.id;
      const detail=isActive&&state.editing
        ? viaControls(v)
        : `<div class="tiny muted">${v.source==='mark' ? 'Coordinates & name follow the saved Mark' : 'Coordinates belong only to this Course'}</div>`;
      const action=state.editing ? `<button data-select-via="${v.id}" class="compact">${isActive?'Editing':'Edit'}</button>` : '';
      return `<div class="via-item ${isActive?'active':''}" data-via-row="${v.id}"><i class="dot ${v.source==='mark'?'saved':'local'}"></i><div><div class="row between"><strong>${escape(v.name)}</strong><span class="${v.source==='mark'?'locked':'muted'}">${v.source==='mark'?'Saved Mark':'Course-local'}</span></div>${detail}</div>${action}</div>`;
    }
    function viaControls(v) { const editable=v.source==='local'; return `<div class="stack" style="margin-top:7px"><label class="tiny muted">Name ${editable?'':'(controlled by saved Mark)'}<input class="via-name" data-rename="${v.id}" value="${escape(v.name)}" ${editable?'':'disabled'} /></label><div class="mini-actions"><button data-move="${v.id}:-1" ${positionInLeg(v)===0?'disabled':''}>↑ Earlier</button><button data-move="${v.id}:1" ${positionInLeg(v)===model().vias.filter(x=>x.leg===v.leg).length-1?'disabled':''}>↓ Later</button><button data-delete="${v.id}" style="color:#a43c16">Delete</button></div>${v.source==='mark'?'<div class="tiny locked">Use the saved Mark editor to rename or move this location. This remains a Via Point.</div>':''}</div>`; }
    function positionInLeg(v) { return model().vias.filter(x=>x.leg===v.leg).findIndex(x=>x.id===v.id); }
    function viaList() { const c=model(); if(!c.vias.length) return `<div class="empty">No Via Points yet.<br><span class="tiny">Select a Leg Segment, then add one deliberately.</span></div>`; return c.marks.slice(0,-1).map((m,leg)=>`<div class="stack"><div class="eyebrow">Inside Leg ${leg+1}: ${escape(m.name)} → ${escape(c.marks[leg+1].name)}</div>${c.vias.filter(v=>v.leg===leg).map(viaEditor).join('')||'<div class="tiny muted">No points inside this Leg.</div>'}</div>`).join(''); }
    function draftTools() { if(!state.editing) return `<div class="actions"><button class="primary" data-action="start-edit">Edit route</button></div>`; return `<div class="actions"><button class="primary" data-action="add-local">Split with a new point</button><button class="secondary" data-action="add-saved">Split with saved Mark</button></div><p class="tiny muted">Both actions split only the selected Leg Segment. Tap the map to position a new point.</p>`; }
    function mapVariant() { return pageHeader('Harbour triangle', 'A map-first editor: location and route shape lead.')+`<section class="screen stack">${mapSvg()}<div class="card stack"><div class="section-head"><div><div class="eyebrow">Selected Leg Segment</div><h2>${escape(segLabel(selectedSeg()))}</h2></div><span class="pill">Leg ${selectedSeg().leg+1}</span></div>${state.scenario==='overlap'?'<div class="callout">Lines cross here. The selected segment is named above and highlighted orange, so a tap never has to guess which route is meant.</div>':''}${draftTools()}</div><div class="card stack"><div class="section-head"><h2>Route details</h2><span class="pill">${model().vias.length} Via Point${model().vias.length===1?'':'s'}</span></div>${viaList()}</div></section>`+editBar(); }
    function storyVariant() { const c=model(); return pageHeader('Harbour triangle', 'B makes the route a readable, editable story; map is supporting evidence.')+`<section class="screen stack"><div class="card">${mapSvg(true)}</div><div class="card"><div class="section-head"><div><div class="eyebrow">Route storyboard</div><h2>Follow the intended shape</h2></div><span class="pill">${state.editing?'Draft':'Saved'}</span></div><div class="story-route">${c.marks.slice(0,-1).map((m,leg)=>{const legSegs=segments().filter(s=>s.leg===leg);return `<div class="stop"><strong>${escape(m.name)}</strong><div class="tiny muted">Course Mark · boundary</div></div>${legSegs.map(s=>`<article class="story-segment ${s.leg===selectedSeg().leg&&s.index===selectedSeg().index?'selected':''}"><div class="row between"><span class="path">${escape(segLabel(s))}</span><button data-select-segment="${s.leg}:${s.index}">${s.leg===selectedSeg().leg&&s.index===selectedSeg().index?'Selected':'Choose'}</button></div><div class="tiny muted">Leg Segment · receives bearing, TWA, tack & sail guidance</div></article>`).join('')}`;}).join('')}<div class="stop end"><strong>${escape(c.marks[c.marks.length-1].name)}</strong><div class="tiny muted">Course Mark · boundary</div></div></div></div><div class="card stack"><div class="section-head"><h2>Via Points in this route</h2><span class="pill">Explicit only</span></div>${viaList()}${draftTools()}</div></section>`+editBar(); }
    function segmentVariant() { const s=selectedSeg(), c=model(), attached=c.vias.filter(v=>v.leg===s.leg); return pageHeader('Harbour triangle', 'C treats every route segment as the object of navigation and editing.')+`<section class="screen stack"><div class="card">${mapSvg()}</div><div class="card"><div class="eyebrow">Choose the exact line</div><div class="route-chooser">${segments().map((x,i)=>`<button data-select-segment="${x.leg}:${x.index}" class="${x.leg===s.leg&&x.index===s.index?'selected':''}">${i+1}. ${escape(x.from.name)} → ${escape(x.to.name)}</button>`).join('')}</div>${state.scenario==='overlap'?'<div class="callout">Overlapping geometry stays unambiguous: choose the named Leg Segment above, then act below.</div>':''}</div><div class="card inspector stack"><div class="section-head"><div><div class="eyebrow">Selected Leg Segment</div><h2>${escape(segLabel(s))}</h2></div><span class="pill">Leg ${s.leg+1}</span></div><dl class="kv"><dt>Starts at</dt><dd>${escape(s.from.name)}</dd><dt>Ends at</dt><dd>${escape(s.to.name)}</dd><dt>Guidance</dt><dd>Per-segment bearing, TWA, tack, sail</dd><dt>Insertion</dt><dd>Splits this line only</dd></dl>${draftTools()}</div><div class="card stack"><div class="section-head"><h2>Points in parent Leg ${s.leg+1}</h2><span class="pill">Reorder only here</span></div>${attached.length?attached.map(viaEditor).join(''):'<div class="empty">No Via Points in this Leg.</div>'}<div class="tiny muted">Moving across a Course Mark needs a separate explicit flow. Course Mark reorder is blocked while Via Points exist.</div></div></section>`+editBar(); }
    function editBar(){ return state.editing?`<footer class="editbar"><button class="cancel" data-action="cancel">Cancel draft</button><button class="save" data-action="save">Save route</button></footer>`:''; }
    function switcher() { const i=variants.findIndex(x=>x.key===state.variant); return `<nav class="switcher" aria-label="Prototype variants"><button data-variant="${variants[(i+variants.length-1)%variants.length].key}" title="Previous variant">←</button><span>${variants[i].name}</span><button data-variant="${variants[(i+1)%variants.length].key}" title="Next variant">→</button></nav>`; }
    function render() {
      validSelection();
      const view=state.variant==='map'?mapVariant():state.variant==='story'?storyVariant():segmentVariant();
      const snapshot={scenario:state.scenario,variant:state.variant,mode:state.editing?'draft':'read-only',selectedLegSegment:selectedSeg()?{leg:selectedSeg().leg+1,label:segLabel(selectedSeg())}:null,selectedVia:state.selectedVia,addMode:state.addMode,route:{courseMarks:model().marks.map(m=>m.name),viaPoints:model().vias.map(v=>({name:v.name,role:'Via Point',parentLeg:v.leg+1,storage:v.source==='mark'?'Saved Mark reference':'course-local coordinates'}))}};
      const app=document.querySelector('#app');
      app.innerHTML=view+`<details class="state"><summary>Prototype state (always inspectable)</summary><pre>${escape(JSON.stringify(snapshot,null,2))}</pre></details>`+switcher()+(state.toast?`<div class="toast">${escape(state.toast)}</div>`:'');
      if(state.variant==='story'){
        const controls=app.querySelector('.actions'),story=app.querySelector('.story-route');
        if(controls&&story)story.closest('.card').querySelector('.section-head').after(controls);
      }
    }
    function setVariant(key){state.variant=key; const u=new URL(location);u.searchParams.set('variant',key);history.replaceState({},'',u);render();}
    function newId(){ return 'v'+(Math.max(0,...model().vias.map(v=>Number(v.id.slice(1))||0))+1); }
    function addVia(source, x, y) { const s=selectedSeg(), c=model(), number=c.vias.length+1; const v={id:newId(),leg:s.leg,name:source==='mark'?'Green pile (saved Mark)':`Via Point ${number}`,source,x,y}; const inLeg=c.vias.filter(a=>a.leg===s.leg); const at=Math.min(s.index,inLeg.length); const global=c.vias.findIndex(a=>a.leg===s.leg && a.id===inLeg[at]?.id); c.vias.splice(global<0?c.vias.length:global,0,v); state.selectedVia=v.id;state.addMode=null;state.toast=source==='mark'?'Added a Mark-backed Via Point. Its name and position follow the saved Mark.':'Placed course-local Via Point. Its default name is ready to replace.';render(); if(source==='local') setTimeout(()=>document.querySelector(`[data-rename="${v.id}"]`)?.focus(),0); }
    document.addEventListener('click', e=>{ const t=e.target.closest('button,[data-leg]'); if(!t)return; if(t.dataset.variant)return setVariant(t.dataset.variant); if(t.dataset.selectSegment){ const [leg,index]=t.dataset.selectSegment.split(':').map(Number);state.selected={leg,index};state.selectedVia=null;render();return; } if(t.dataset.leg!==undefined){state.selected={leg:+t.dataset.leg,index:+t.dataset.index};state.selectedVia=null;render();return;} if(t.dataset.selectVia){state.selectedVia=t.dataset.selectVia;render();return;} const a=t.dataset.action; if(a==='start-edit'){draft=JSON.parse(JSON.stringify(saved));state.editing=true;state.toast='Editing a complete draft. Save commits it; Cancel discards it.';render();} if(a==='open-via'){state.toast='Enter Edit route to place, rename, move, or delete Via Points.';render();} if(a==='cancel'){draft=JSON.parse(JSON.stringify(saved));state.editing=false;state.addMode=null;state.selectedVia=null;state.toast='Draft discarded. Saved Course remains unchanged.';render();} if(a==='save'){saved=JSON.parse(JSON.stringify(draft));state.editing=false;state.addMode=null;state.toast='Complete route draft saved.';render();} if(a==='add-local'){state.addMode='local';state.toast='Tap any map location to place one course-local Via Point in the selected Leg Segment.';render();} if(a==='add-saved'){const s=selectedSeg();addVia('mark',(s.from.x+s.to.x)/2,(s.from.y+s.to.y)/2);} if(t.dataset.delete){const id=t.dataset.delete;draft.vias=draft.vias.filter(v=>v.id!==id);state.selectedVia=null;state.toast='Via Point removed from the draft.';render();} if(t.dataset.move){const [id,deltaText]=t.dataset.move.split(':');const v=draft.vias.find(x=>x.id===id),same=draft.vias.filter(x=>x.leg===v.leg),p=same.indexOf(v),q=p+Number(deltaText);if(q>=0&&q<same.length){const other=same[q],a=draft.vias.indexOf(v),b=draft.vias.indexOf(other);[draft.vias[a],draft.vias[b]]=[draft.vias[b],draft.vias[a]];state.toast='Reordered within its parent Leg.';render();}} });
    document.addEventListener('input', e=>{if(e.target.dataset.rename){const v=draft.vias.find(x=>x.id===e.target.dataset.rename);if(v)v.name=e.target.value;}});
    document.addEventListener('change', e=>{if(e.target.dataset.rename){state.toast='Via Point name updated in the draft.';render();return;} if(e.target.id==='scenarioSelect'){state.scenario=e.target.value;saved=cloneScenario(state.scenario);draft=cloneScenario(state.scenario);state.editing=false;state.selected={leg:0,index:0};state.selectedVia=null;state.addMode=null;state.toast='Scenario reset to its saved Course.';render();}});
    document.addEventListener('click', e=>{if(!state.addMode)return;const svg=e.target.closest('#mapSurface svg');if(!svg)return;const r=svg.getBoundingClientRect();addVia('local',Math.max(2,Math.min(98,(e.clientX-r.left)/r.width*100)),Math.max(2,Math.min(98,(e.clientY-r.top)/r.height*100)));});
    document.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const active=document.activeElement;if(active?.matches('input, textarea, [contenteditable="true"]'))return;e.preventDefault();const i=variants.findIndex(x=>x.key===state.variant);setVariant(variants[(i+(e.key==='ArrowRight'?1:variants.length-1))%variants.length].key);});
    render();
  </script>
</body>
