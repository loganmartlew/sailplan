<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype — Course detail via points</title>
    <style>
      :root { --ink:#10233e; --muted:#64748b; --line:#dbe4ef; --bg:#eaf1f8; --paper:#fff; --navy:#075985; --blue:#0ea5e9; --cyan:#dff5ff; --green:#0f766e; --amber:#b45309; --rose:#be123c; }
      * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.35 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      button { font:inherit; cursor:pointer } button:focus-visible { outline:3px solid #fbbf24; outline-offset:2px }
      .prototype-note { max-width:900px; margin:18px auto 0; padding:12px 16px; color:#36516f; font-size:13px; }
      .phone { width:min(100%,430px); min-height:790px; margin:0 auto 90px; overflow:hidden; background:var(--paper); box-shadow:0 20px 70px #1e3a5f35; }
      .bar { display:flex; align-items:center; justify-content:space-between; padding:16px 18px 12px; border-bottom:1px solid var(--line); }
      .back { color:var(--navy); border:0; background:none; padding:0; font-weight:700; }.dots { letter-spacing:2px; font-size:20px }
      .hero { padding:16px 18px 12px; background:linear-gradient(135deg,#edf9ff,#f5fbff); }.eyebrow { color:var(--navy); text-transform:uppercase; font-size:11px; font-weight:800; letter-spacing:.08em }.hero h1 { margin:3px 0; font-size:25px; letter-spacing:-.03em }.sub { margin:0; color:var(--muted) }
      .toolbar { display:flex; gap:8px; padding:12px 18px; overflow:auto; border-bottom:1px solid var(--line) }.chip { flex:0 0 auto; padding:7px 10px; border:1px solid var(--line); border-radius:99px; color:#35506e; background:white; font-size:12px; font-weight:700 }.chip.active { border-color:var(--navy); background:#e0f2fe; color:#075985 }.scenario-label { padding:10px 18px 0; color:var(--muted); font-size:12px; font-weight:700 }
      .content { padding:14px 18px 24px }.variant-heading { display:flex; gap:10px; align-items:flex-start; margin:4px 0 15px }.number { display:grid; place-items:center; width:25px; height:25px; border-radius:7px; background:#dff5ff; color:var(--navy); font-weight:900 }.variant-heading h2 { margin:0; font-size:16px }.variant-heading p { margin:2px 0 0; color:var(--muted); font-size:12px }
      .action { border:1px solid #b9d8ee; background:#f4fbff; color:var(--navy); border-radius:8px; padding:7px 9px; font-weight:800; font-size:12px }.action.primary { border-color:var(--navy); background:var(--navy); color:#fff }.action.danger { color:var(--rose); border-color:#fecdd3; background:#fff8f8 }.action:disabled { cursor:not-allowed; opacity:.5 }.map-action { display:flex; align-items:center; justify-content:center; width:100%; gap:6px; margin:0 0 14px; }
      .state { margin:0 18px 16px; border:1px dashed #9bb8d4; border-radius:8px; padding:9px 10px; background:#f6fbff; color:#38566f; font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap }.feedback { margin:0 18px 12px; padding:8px 10px; border-left:3px solid var(--amber); color:#754308; background:#fffbeb; font-size:12px }.hidden{display:none!important}.inline-map{position:relative;width:100%;height:135px;margin:0 0 14px;overflow:hidden;border:1px solid #9bc9df;border-radius:12px;background:linear-gradient(135deg,#bce8f7,#e9f8f7 57%,#d5efd4 57%);color:var(--ink);text-align:left}.inline-map svg{width:100%;height:100%}.inline-map span{position:absolute;left:10px;bottom:9px;padding:5px 7px;border-radius:7px;background:#10233edc;color:#fff;font-size:11px;font-weight:800}.inline-map small{position:absolute;right:10px;top:9px;padding:4px 6px;border-radius:6px;background:#fff;color:var(--navy);font-weight:800}
      .thread { position:relative; margin-left:10px; border-left:2px solid #c8dcec; padding-left:20px }.mark { position:relative; padding:6px 0 18px }.mark:before { content:""; position:absolute; width:11px; height:11px; left:-27px; top:16px; border:3px solid var(--navy); border-radius:50%; background:#fff }.mark-name { display:flex; align-items:center; justify-content:space-between; min-height:34px; font-weight:900 }.mark-role { display:block; margin-top:1px; color:var(--muted); font-size:11px; font-weight:700 }.move-mark { border:0; background:none; color:#8a3d0d; padding:5px; font-size:11px; font-weight:800 }.leg-thread { margin:7px 0 3px; border:1px solid var(--line); border-radius:11px; overflow:hidden; background:#fff }.leg-title { display:flex; align-items:center; justify-content:space-between; padding:9px 11px; background:#f8fafc; color:#47627c; font-size:11px; font-weight:800 }.leg-title small { display:block; margin-top:1px; color:var(--muted); font-weight:600 }.leg-count { color:var(--green); white-space:nowrap }.segment { display:flex; align-items:center; gap:9px; padding:10px 11px; border:0; border-top:1px solid #edf2f7; background:#fff; color:var(--ink); text-align:left; width:100% }.segment.selected { background:#eaf8ff; box-shadow:inset 3px 0 var(--blue) }.segment-key { display:grid; place-items:center; flex:0 0 auto; width:27px; height:27px; border-radius:7px; background:#edf4fa; color:#45617b; font-size:10px; font-weight:900 }.segment.selected .segment-key { background:#cdeeff; color:var(--navy) }.segment strong,.via strong { display:block; font-size:12px }.segment small,.via small { display:block; margin-top:1px; color:var(--muted) }.via { display:flex; align-items:center; gap:9px; padding:10px 11px 10px 21px; border-top:1px dashed #b5ddc0; color:#14532d; background:#f4fbf6 }.via-icon { display:grid; place-items:center; width:18px; height:18px; color:var(--green); font-size:16px }.reorder { display:flex; gap:3px; margin-left:auto }.tiny { width:26px; height:26px; border:1px solid #b7d7c1; border-radius:6px; background:#fff; color:var(--green); font-weight:900 }.tiny.map { border-color:#b9d8ee; color:var(--navy) }.tiny.remove { border-color:#fecdd3; color:var(--rose) }.tiny:disabled { opacity:.35; cursor:not-allowed }.leg-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 11px; border-top:1px solid #edf2f7; background:#fbfdff }.leg-footer small { color:var(--muted); font-size:11px }
      .leg-deck { display:grid; gap:11px }.deck { border:1px solid var(--line); border-radius:13px; padding:12px; box-shadow:0 2px 5px #1e3a5f0a }.deck-top { display:flex; justify-content:space-between; align-items:center }.deck h3 { margin:0; font-size:15px }.deck p { margin:2px 0 10px; color:var(--muted); font-size:12px }.route-strip { display:flex; align-items:center; gap:2px; padding:8px 0; overflow:auto }.route-node { display:grid; place-items:center; flex:0 0 auto; width:25px; height:25px; color:#fff; background:var(--navy); border-radius:50%; font-size:10px; font-weight:900 }.route-via { background:var(--green); border-radius:7px }.route-line { flex:1 0 10px; height:3px; background:#b9d8ee }.segment-picker { display:flex; flex-wrap:wrap; gap:5px; margin:9px 0 }.segment-pill { border:1px solid var(--line); border-radius:6px; padding:5px 6px; background:#fff; color:#45617b; font-size:11px }.segment-pill.selected { border-color:var(--blue); color:var(--navy); background:#e0f5ff; font-weight:800 }.deck-actions { display:flex; gap:6px; border-top:1px solid #edf2f7; padding-top:10px }.deck-actions .action { flex:1 }.locked { padding:8px; border-radius:7px; background:#fff7ed; color:#9a4d08; font-size:11px }
      .canvas { position:relative; padding:10px 0 3px }.canvas-line { position:absolute; top:33px; left:20px; right:20px; height:2px; background:#b9d8ee }.lane { position:relative; margin-bottom:16px; padding:10px; border:1px solid var(--line); border-radius:11px; background:#fff }.lane-header { display:flex; justify-content:space-between; color:#47627c; font-size:11px; font-weight:800 }.stations { display:flex; align-items:center; justify-content:space-between; gap:3px; margin-top:10px }.station { position:relative; z-index:1; display:grid; place-items:center; width:34px; min-height:34px; padding:4px; border:2px solid #b9d8ee; border-radius:10px; background:#fff; color:#41607a; text-align:center; font-size:9px; font-weight:800 }.station.mark-station { border-radius:50%; border-color:var(--navy); color:var(--navy) }.station.via-station { border-color:var(--green); color:var(--green) }.station.selected { background:#e0f5ff; box-shadow:0 0 0 3px #bce9ff }.segment-controls { display:flex; gap:6px; margin-top:11px }.segment-controls .action { flex:1 }.move-sheet { padding:10px; border:1px solid #fecdd3; background:#fff8f8; border-radius:10px; color:#7f1d1d; font-size:12px }.move-sheet strong { display:block; margin-bottom:3px }.map-overlay { position:fixed; inset:0; display:grid; place-items:center; z-index:20; background:#0f2747b8; padding:18px }.map-card { width:min(100%,430px); background:white; border-radius:17px; overflow:hidden; box-shadow:0 20px 70px #001d3b90 }.map-head { display:flex; justify-content:space-between; align-items:center; padding:13px 15px; border-bottom:1px solid var(--line); font-weight:900 }.close { border:0; background:none; font-size:20px }.map-surface { position:relative; height:350px; overflow:hidden; background:linear-gradient(135deg,#bce8f7,#e9f8f7 57%,#d5efd4 57%) }.map-surface.place { cursor:crosshair }.island { position:absolute; right:-44px; top:55px; width:190px; height:270px; transform:rotate(-18deg); border-radius:47% 0 0 38%; background:#a4cc91; opacity:.8 }.map-route { position:absolute; inset:0 }.map-route svg { width:100%; height:100% }.map-pin { position:absolute; transform:translate(-50%,-50%); padding:4px 6px; border:2px solid var(--navy); border-radius:10px; color:var(--navy); background:#fff; font-size:10px; font-weight:900 }.map-pin.via-pin { border-color:var(--green); color:var(--green) }.map-pin.active-pin { box-shadow:0 0 0 5px #fbbf247a }.map-pin.draft-pin { border-color:#b45309; color:#92400e; box-shadow:0 0 0 5px #fbbf2470 }.map-note { padding:12px 15px; color:#38566f; font-size:12px }.map-edit-note { padding:10px 15px; border-top:1px solid #b9d8ee; background:#eaf8ff; color:#075985; font-size:12px; font-weight:700 }.map-field { display:block; padding:0 15px 12px; color:#38566f; font-size:12px; font-weight:800 }.map-field input { display:block; width:100%; margin-top:5px; padding:9px 10px; border:1px solid #9bb8d4; border-radius:8px; color:var(--ink); font:inherit }.map-foot { display:flex; gap:8px; padding:0 15px 15px }.map-foot .action { flex:1 }
      .switcher { position:fixed; z-index:30; right:18px; bottom:18px; display:flex; align-items:center; gap:8px; padding:8px; border:1px solid #bfd3e4; border-radius:999px; background:#10233e; color:#fff; box-shadow:0 10px 28px #10233e55 }.switcher button { width:31px; height:31px; border:0; border-radius:50%; background:#fff; color:var(--ink); font-size:18px; font-weight:900 }.switcher span { min-width:66px; text-align:center; font-size:11px; font-weight:800 }
      @media (min-width:740px) { .phone { margin-top:14px; border-radius:24px; } }
    </style>
  </head>
  <body>
    <div class="prototype-note"><strong>THROWAWAY PROTOTYPE.</strong> Course-detail structures for the Via Points decision. Select a scenario and interact with a segment, via point, map, or Course Mark move. State is in-memory only.</div>
    <main class="phone" aria-live="polite">
      <header class="bar"><button class="back">‹ Courses</button><span class="dots">•••</span></header>
      <section class="hero"><div class="eyebrow">Wednesday night series</div><h1>Harbour Return</h1><p class="sub" id="summary">4 Course Marks · 3 Legs · 0 Via Points</p></section>
      <nav class="toolbar" aria-label="Route samples"><button class="chip active" data-scenario="zero">Zero Via Points</button><button class="chip" data-scenario="one">Headland detour</button><button class="chip" data-scenario="several">Channel route</button><button class="chip" data-scenario="overlap">Overlapping Legs</button></nav>
      <div class="scenario-label" id="scenario-caption"></div>
      <div id="feedback" class="feedback hidden"></div>
      <div id="variant"></div>
      <pre class="state" id="state"></pre>
    </main>
    <div class="switcher"><button id="prev" aria-label="Previous prototype">‹</button><span id="switch-label"></span><button id="next" aria-label="Next prototype">›</button></div>
    <div id="map-modal" class="map-overlay hidden" role="dialog" aria-modal="true" aria-label="Course map"></div>
    <div id="add-modal" class="map-overlay hidden" role="dialog" aria-modal="true" aria-label="Add Via Point"></div>
    <script>
      const variants = ['thread','decks','canvas'];
      const variantNames = { thread:'1 / Route thread', decks:'2 / Leg decks', canvas:'3 / Segment canvas' };
      const sample = {
        zero: { caption:'Baseline: Course Marks are adjacent; every Leg has one Leg Segment.', vias:{a:[],b:[],c:[]} },
        one: { caption:'One headland detour: the middle Leg has two Leg Segments.', vias:{a:[],b:[{id:'headland',name:'North Head clearance'}],c:[]} },
        several: { caption:'Channel route: Via Points make the intentional shape visible without making safety claims.', vias:{a:[{id:'breakwater',name:'Breakwater end'}],b:[{id:'headland',name:'North Head clearance'}],c:[{id:'green',name:'Green channel',markBacked:true},{id:'red',name:'Red channel',markBacked:true}]} },
        overlap: { caption:'Overlapping geometry: select the named Leg Segment first; the map labels and highlights it so no line must be guessed.', vias:{a:[{id:'shoal',name:'North of shoal'}],b:[{id:'beacon',name:'Return-channel beacon',markBacked:true}],c:[]} },
      };
      const legs = [
        {id:'a',from:'Start',to:'North Head',mark:'North Head'}, {id:'b',from:'North Head',to:'Channel Gate',mark:'Channel Gate'}, {id:'c',from:'Channel Gate',to:'Finish',mark:'Finish'}
      ];
      let route = structuredClone(sample.zero), draftRoute = null, scenario = 'zero', selected = { leg:'a', segment:0 }, feedback = '', mapOpen = false, mapMode = 'read', mapContext = null, draftVia = null, movingVia = null, addChoiceLeg = null, addChoiceOrigin = 'detail', placementOrigin = 'detail';
      let current = new URLSearchParams(location.search).get('variant'); if (!variants.includes(current)) current='thread';
      const $ = s => document.querySelector(s);
      function course(){return draftRoute||route} function vias(legId) { return course().vias[legId] }
      function segments(leg) { const points=[leg.from,...vias(leg.id).map(v=>v.name),leg.to]; return points.slice(0,-1).map((from,index)=>({from,to:points[index+1],index})); }
      function totalVias() { return Object.values(course().vias).flat().length }
      function hasAffectedVias(mark) { const targets=legs.filter(l=>l.from===mark||l.to===mark); return targets.some(l=>vias(l.id).length) }
      function setFeedback(message) { feedback=message; render() }
      function selectSegment(leg, segment) { selected={leg,segment}; feedback=`Selected ${leg.toUpperCase()}${segment + 1}: ${segments(legs.find(x=>x.id===leg))[segment].from} → ${segments(legs.find(x=>x.id===leg))[segment].to}. The Course Map will retain this context.`; render() }
      function addVia(legId=selected.leg) { if(!draftRoute)return setFeedback('Open the map and choose Edit saved Course before changing this route.'); const list=vias(legId); const name=`Via point ${totalVias() + 1}`; list.splice(selected.segment,0,{id:`local-${Date.now()}`,name}); feedback=`Added “${name}” by splitting selected Leg Segment ${legId.toUpperCase()}${selected.segment+1}. Its name is ready to replace.`; render() }
      function moveVia(legId,index,delta) { if(!draftRoute)return setFeedback('Edit saved Course first.'); const list=vias(legId), target=index+delta; if(target<0||target>=list.length) return; [list[index],list[target]]=[list[target],list[index]]; feedback=`Reordered “${list[target].name}” within Leg ${legId.toUpperCase()}. It cannot cross a Course Mark from this control.`; render() }
      function deleteVia(legId,index) { if(!draftRoute)return setFeedback('Edit saved Course first.'); const [removed]=vias(legId).splice(index,1); const leg=legs.find(x=>x.id===legId); selected={leg:legId,segment:Math.min(selected.leg===legId?selected.segment:0,segments(leg).length-1)}; feedback=`Removed “${removed.name}” from Leg ${legId.toUpperCase()}.`; render() }
      function renameVia(legId,index){const via=vias(legId)[index];if(!draftRoute)return setFeedback('Edit saved Course first.');if(via.markBacked)return setFeedback(`“${via.name}” is Mark-backed. Edit its name and location in the saved Mark editor.`);const name=prompt('Via Point name',via.name);if(name&&name.trim()){via.name=name.trim();feedback='Renamed this course-local Via Point in the draft.';render()}} function moveAcrossMark(legId,index){if(!draftRoute)return setFeedback('Edit saved Course first.');const via=vias(legId)[index],choice=prompt(`Move “${via.name}” across a Course Mark to which Leg? (A, B, or C)`,legId),target=(choice||'').toLowerCase();if(!legs.some(l=>l.id===target)||target===legId)return setFeedback('No cross-Mark move was made. This requires choosing another parent Leg explicitly.');vias(legId).splice(index,1);vias(target).push(via);feedback=`Explicitly moved “${via.name}” across a Course Mark into Leg ${target.toUpperCase()}.`;render()}
      function tryMoveMark(mark) { if (hasAffectedVias(mark)) setFeedback(`Cannot move Course Mark “${mark}” while its affected Leg contains Via Points. Resolve or explicitly move those Via Points first.`); else setFeedback(`“${mark}” has no affected Via Points; Course Mark ordering is available in the normal edit flow.`) }
      function changeScenario(next) { scenario=next; route=structuredClone(sample[next]); draftRoute=null; selected={leg:'a',segment:0}; mapContext=null; draftVia=null; movingVia=null; feedback=''; render() }
      function detailEditBar(){return draftRoute?`<div class="map-edit-note">Editing draft · <button class="action" onclick="saveDetailDraft()">Save Course</button> <button class="action" onclick="cancelDetailDraft()">Cancel draft</button></div>`:`<button class="action primary map-action" onclick="startDetailEdit()">Edit route</button>`} function inlineMap(){return `<button class="inline-map" onclick="openMap()" aria-label="Expand Course Map"><svg viewBox="0 0 400 150" fill="none"><path d="M22 126 L124 82 L220 94 L362 30" stroke="#075985" stroke-width="5" stroke-linecap="round"/><path d="M30 118 L132 74 L222 102" stroke="${scenario==='overlap'?'#7c3aed':'#0ea5e9'}" stroke-width="3" stroke-dasharray="7 5"/><path d="M${selected.leg==='a'?'22 126 L124 82':selected.leg==='b'?'124 82 L220 94':'220 94 L362 30'}" stroke="#f59e0b" stroke-width="9" stroke-linecap="round" opacity=".85"/></svg><small>${selected.leg.toUpperCase()}${selected.segment+1} selected</small><span>Course Map · tap to expand</span></button>`} function routeThread() { return `<section class="content"><div class="variant-heading"><div class="number">1</div><div><h2>Route thread</h2><p>Course Marks define the route; each Leg keeps its Via Points directly beneath it.</p></div></div>${inlineMap()}${detailEditBar()}<div class="thread">${marksThread()}</div></section>` }
      function marksThread() { let html=''; const markNames=['Start','North Head','Channel Gate','Finish']; markNames.forEach((mark,i)=>{ html+=`<div class="mark"><div class="mark-name"><span>${mark}<small class="mark-role">Course Mark</small></span>${i>0&&i<3?`<button class="move-mark" onclick="tryMoveMark('${mark}')">↕ Reorder</button>`:''}</div>`; if(i<legs.length) html+=threadLeg(legs[i]); html+='</div>'; }); return html }
      function threadLeg(leg) { const list=vias(leg.id), segs=segments(leg); let result=`<div class="leg-thread"><div class="leg-title"><span>LEG ${leg.id.toUpperCase()}<small>${leg.from} → ${leg.to}</small></span><span class="leg-count">${list.length ? list.length+' Via Point'+(list.length===1?'':'s') : 'Direct'}</span></div>`; segs.forEach((seg,i)=>{const active=selected.leg===leg.id&&selected.segment===i; result+=`<button class="segment ${active?'selected':''}" onclick="selectSegment('${leg.id}',${i})"><span class="segment-key">${leg.id.toUpperCase()}${i+1}</span><span><strong>${seg.from} → ${seg.to}</strong><small>Leg Segment${scenario==='overlap'?' · selected by name, not geometry':''}</small></span></button>`; if(i<list.length){const v=list[i]; result+=`<div class="via"><span class="via-icon">◇</span><span><strong>${v.name}</strong><small>${v.markBacked?'Saved Mark · edit in saved Mark editor':'Via Point · stays in Leg '+leg.id.toUpperCase()}</small></span><span class="reorder">${v.markBacked?'':`<button class="tiny" title="Rename" onclick="renameVia('${leg.id}',${i})">✎</button><button class="tiny map" title="Move on map" aria-label="Move ${v.name} on map" onclick="startViaMove('${leg.id}',${i})">⌖</button><button class="tiny" title="Move across Course Mark" onclick="moveAcrossMark('${leg.id}',${i})">⇆</button>`}<button class="tiny" title="Move up" aria-label="Move ${v.name} up" onclick="moveVia('${leg.id}',${i},-1)" ${i===0?'disabled':''}>↑</button><button class="tiny" title="Move down" aria-label="Move ${v.name} down" onclick="moveVia('${leg.id}',${i},1)" ${i===list.length-1?'disabled':''}>↓</button><button class="tiny remove" title="Remove Via Point" aria-label="Remove ${v.name}" onclick="deleteVia('${leg.id}',${i})">×</button></span></div>`} }); result+=`<div class="leg-footer"><small>Select a Leg Segment, then add one deliberately.</small><button class="action" onclick="openAddChoice('${leg.id}')">＋ Add Via Point</button></div></div>`; return result }
      function legDecks() { return `<section class="content"><div class="variant-heading"><div class="number">2</div><div><h2>Leg decks</h2><p>Each sailor-recognised Mark-to-Mark Leg is a self-contained card with a route strip and local tools.</p></div></div><button class="action primary map-action" onclick="openMap()">⌖ Open Course Map <span>→ context travels with selection</span></button><div class="leg-deck">${legs.map(deck).join('')}</div></section>` }
      function deck(leg) { const list=vias(leg.id), segs=segments(leg), node=n=>`<span class="route-node ${n.via?'route-via':''}">${n.label}</span>`; let strip=node({label:leg.from.slice(0,2)}); list.forEach((v,i)=>{strip+='<span class="route-line"></span>'+node({label:'◇',via:true})}); strip+='<span class="route-line"></span>'+node({label:leg.to.slice(0,2)}); return `<article class="deck"><div class="deck-top"><h3>Leg ${leg.id.toUpperCase()}</h3><button class="action danger" onclick="tryMoveMark('${leg.to}')">↕ Move ${leg.to}</button></div><p>${leg.from} → ${leg.to} · ${list.length ? list.length+' Via Point'+(list.length>1?'s':'') : 'direct'}</p><div class="route-strip">${strip}</div><div class="segment-picker">${segs.map((s,i)=>`<button class="segment-pill ${selected.leg===leg.id&&selected.segment===i?'selected':''}" onclick="selectSegment('${leg.id}',${i})">${s.from} → ${s.to}</button>`).join('')}</div>${list.length?`<div class="locked">◇ ${list.map((v,i)=>`${v.name} <button class="tiny" onclick="moveVia('${leg.id}',${i},-1)">←</button><button class="tiny" onclick="moveVia('${leg.id}',${i},1)">→</button>`).join(' · ')}</div>`:''}<div class="deck-actions"><button class="action ${selected.leg===leg.id?'primary':''}" onclick="${selected.leg===leg.id?'addVia()':'selectSegment(\''+leg.id+'\',0)'}">＋ ${selected.leg===leg.id?'Add at selected segment':'Select a segment'}</button><button class="action" onclick="openMap('${leg.id}')">View Leg on map</button></div></article>` }

} function placeViaOnMap(event){const r=event.currentTarget.getBoundingClientRect(),p={x:Math.round((event.clientX-r.left)/r.width*100),y:Math.round((event.clientY-r.top)/r.height*100)};if(draftVia)draftVia.position=p;if(movingVia)movingVia.position=p;feedback='Map location selected.';render()} function commitViaPlacement(){if(!draftVia?.position)return;vias(draftVia.leg).splice(selected.segment,0,{id:`local-${Date.now()}`,name:draftVia.name||`Via point ${totalVias()+1}`,position:draftVia.position});feedback=`Added “${draftVia.name}” by splitting ${selected.leg.toUpperCase()}${selected.segment+1}.`;draftVia=null;mapMode='read';mapOpen=false;render()} function cancelViaPlacement(){draftVia=null;mapMode='read';mapOpen=false;render()} function commitViaMove(){vias(movingVia.leg)[movingVia.index].position=movingVia.position;feedback=`Moved “${movingVia.name}”.`;movingVia=null;mapMode='read';mapOpen=false;render()} function cancelViaMove(){movingVia=null;mapMode='read';mapOpen=false;render()} function integratedMapModal(){const placing=mapMode==='place',moving=mapMode==='move',seg=segments(legs.find(x=>x.id===selected.leg))[selected.segment],title=placing?'Drop new Via Point':moving?'Move Via Point':'Course Map · read-only',note=placing?`Focused on selected <strong>${selected.leg.toUpperCase()}${selected.segment+1}: ${seg.from} → ${seg.to}</strong>. Drop one pin only.`:moving?`Move <strong>${movingVia.name}</strong>, then keep or cancel the new location.`:'Route overview only. It records route shape and makes no navigability or safety claim.',field=placing?`<label class="map-field">Name (selected to replace)<input id="via-name" value="${draftVia.name}" oninput="draftVia.name=this.value" /></label>`:'',foot=placing?`<button class="action" onclick="cancelViaPlacement()">Cancel</button><button class="action primary" onclick="commitViaPlacement()" ${draftVia.position?'':'disabled'}>Add Via Point</button>`:moving?`<button class="action" onclick="cancelViaMove()">Cancel</button><button class="action primary" onclick="commitViaMove()">Keep location</button>`:`<button class="action" onclick="closeMap()">Back to Course detail</button>`;return `<div class="map-card"><div class="map-head"><span>${title}</span><button class="close" onclick="${placing?'cancelViaPlacement()':moving?'cancelViaMove()':'closeMap()'}">×</button></div>${mapCanvas()}<div class="map-note">${note}</div>${field}<div class="map-foot">${foot}</div></div>`}
      function mapCanvas(){const seg=segments(legs.find(x=>x.id===selected.leg))[selected.segment],placing=mapMode==='place',moving=mapMode==='move',selectorPositions={a:[['22','70'],['35','56'],['45','45']],b:[['48','53'],['60','60'],['70','49']],c:[['72','50'],['80','37'],['88','24']]};if(placing)return `<div class="map-surface place" onclick="placeViaOnMap(event)"><div class="island"></div><div class="map-route"><svg viewBox="0 0 400 350" fill="none"><path d="M48 270 L350 72" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/><text x="48" y="294" fill="#10233e" font-size="15">${seg.from}</text><text x="286" y="62" fill="#10233e" font-size="15">${seg.to}</text></svg></div><span class="map-pin" style="left:12%;top:78%">Start</span><span class="map-pin" style="left:86%;top:20%">End</span>${draftVia?.position?`<span class="map-pin draft-pin" style="left:${draftVia.position.x}%;top:${draftVia.position.y}%">◇ New</span>`:''}</div>`;const selectors=legs.flatMap(l=>segments(l).map((_,i)=>{const p=selectorPositions[l.id][Math.min(i,2)],active=selected.leg===l.id&&selected.segment===i;return `<button class="map-pin ${active?'active-pin':''}" style="left:${p[0]}%;top:${p[1]}%" onclick="selectSegment('${l.id}',${i})" title="Select ${l.id.toUpperCase()}${i+1}">${l.id.toUpperCase()}${i+1}</button>`})).join('');const pins=legs.flatMap(l=>vias(l.id).map((v,i)=>{const p=v.position||{x:48+i*8,y:42+i*7};return `<button class="map-pin via-pin" style="left:${p.x}%;top:${p.y}%" onclick="startViaMove('${l.id}',${i})" title="Move ${v.name}">◇</button>`})).join('');return `<div class="map-surface ${moving?'place':''}" ${moving?'onclick="placeViaOnMap(event)"':''}><div class="island"></div><div class="map-route"><svg viewBox="0 0 400 350" fill="none"><path d="M40 275 L130 215 L190 155 L248 210 L340 82" stroke="#075985" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M${selected.leg==='a'?'40 275 L130 215':selected.leg==='b'?'130 215 L248 210':'248 210 L340 82'}" stroke="#f59e0b" stroke-width="11" stroke-linecap="round"/></svg></div>${selectors}${pins}${movingVia?.position?`<span class="map-pin draft-pin" style="left:${movingVia.position.x}%;top:${movingVia.position.y}%">◇ Move</span>`:''}</div>`} function integratedMapModal(){const placing=mapMode==='place',moving=mapMode==='move',seg=segments(legs.find(x=>x.id===selected.leg))[selected.segment],title=placing?'Drop new Via Point':moving?'Move Via Point':'Course Map',note=placing?`Focused on selected <strong>${selected.leg.toUpperCase()}${selected.segment+1}: ${seg.from} → ${seg.to}</strong>. Drop one pin only.`:moving?`Move <strong>${movingVia.name}</strong>, then keep or cancel the new location.`:`Tap a named Leg Segment to select it. Tap a green diamond to move that course-local Via Point. Mark-backed diamonds direct you to their saved Mark editor.`,field=placing?`<label class="map-field">Name (selected to replace)<input id="via-name" value="${draftVia.name}" oninput="draftVia.name=this.value" /></label>`:'',foot=placing?`<button class="action" onclick="cancelViaPlacement()">Cancel</button><button class="action primary" onclick="commitViaPlacement()" ${draftVia.position?'':'disabled'}>Add Via Point</button>`:moving?`<button class="action" onclick="cancelViaMove()">Cancel</button><button class="action primary" onclick="commitViaMove()">Keep location</button>`:`<button class="action" onclick="closeMap()">Back to Course detail</button><button class="action primary" onclick="openAddChoice(selected.leg,'map')">＋ Add to ${selected.leg.toUpperCase()}${selected.segment+1}</button>`;return `<div class="map-card"><div class="map-head"><span>${title}</span><button class="close" onclick="${placing?'cancelViaPlacement()':moving?'cancelViaMove()':'closeMap()'}">×</button></div>${mapCanvas()}<div class="map-note">${note}</div>${field}<div class="map-foot">${foot}</div></div>`}
      function openAddChoice(leg,origin='detail'){if(selected.leg!==leg)return setFeedback('Select the exact Leg Segment before adding a Via Point.');addChoiceLeg=leg;addChoiceOrigin=origin;render()} function chooseAdd(kind){const leg=addChoiceLeg,origin=addChoiceOrigin;addChoiceLeg=null;if(kind==='map')startViaPlacement(leg,origin);else{startSavedMark(leg);if(origin==='map'){mapOpen=true;mapMode='read'}}} function startViaPlacement(leg,origin='detail'){if(selected.leg!==leg)return setFeedback('Select the exact Leg Segment before adding a Via Point.');placementOrigin=origin;draftVia={leg,name:`Via point ${totalVias()+1}`,position:null};mapMode='place';mapOpen=true;render();$('#via-name')?.select?.()} function commitViaPlacement(){if(!draftVia?.position)return;vias(draftVia.leg).splice(selected.segment,0,{id:`local-${Date.now()}`,name:draftVia.name||`Via point ${totalVias()+1}`,position:draftVia.position});feedback=`Added “${draftVia.name}” by splitting ${selected.leg.toUpperCase()}${selected.segment+1}.`;draftVia=null;mapMode='read';mapOpen=placementOrigin==='map';placementOrigin='detail';render()}
      function render() { $('#summary').textContent=`4 Course Marks · 3 Legs · ${totalVias()} Via Point${totalVias()===1?'':'s'}`; $('#scenario-caption').textContent=sample[scenario].caption; document.querySelectorAll('[data-scenario]').forEach(b=>b.classList.toggle('active',b.dataset.scenario===scenario)); $('#variant').innerHTML=current==='thread'?routeThread():current==='decks'?legDecks():segmentCanvas(); $('#switch-label').textContent=variantNames[current]; $('#feedback').textContent=feedback; $('#feedback').classList.toggle('hidden',!feedback); $('#state').textContent=`VISIBLE STATE\nvariant: ${current}\nscenario: ${scenario}\nmode: immediate in-memory edits\nselected Leg Segment: ${selected.leg.toUpperCase()}${selected.segment+1}\nvia order: ${legs.map(l=>l.id.toUpperCase()+': '+(vias(l.id).map(v=>v.name).join(' → ')||'none')).join(' | ')}\nmap: ${mapOpen?mapMode:'closed'}\nadd chooser: ${addChoiceLeg?'Leg '+addChoiceLeg.toUpperCase():'closed'}\ndraft Via Point: ${draftVia?draftVia.name+(draftVia.position?' · placed':' · awaiting map placement'):'none'}\nmoving Via Point: ${movingVia?movingVia.name:'none'}`; const modal=$('#map-modal'); modal.innerHTML=mapOpen?integratedMapModal():''; modal.classList.toggle('hidden',!mapOpen); const chooser=$('#add-modal'); chooser.innerHTML=addChoiceLeg?`<div class="map-card"><div class="map-head"><span>Add Via Point · ${addChoiceLeg.toUpperCase()}${selected.segment+1}</span><button class="close" onclick="addChoiceLeg=null;render()">×</button></div><div class="map-note">Choose one source. The new point will split the selected Leg Segment and stay ordered within Leg ${addChoiceLeg.toUpperCase()}.</div><div class="map-foot"><button class="action" onclick="chooseAdd('mark')">◇ Existing Mark</button><button class="action primary" onclick="chooseAdd('map')">⌖ Map pin</button></div></div>`:''; chooser.classList.toggle('hidden',!addChoiceLeg); history.replaceState(null,'',`?variant=${current}`) }
      document.querySelectorAll('[data-scenario]').forEach(b=>b.addEventListener('click',()=>changeScenario(b.dataset.scenario))); function switchVariant(delta){current=variants[(variants.indexOf(current)+delta+variants.length)%variants.length];render()} $('#prev').onclick=()=>switchVariant(-1); $('#next').onclick=()=>switchVariant(1); document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')switchVariant(-1);if(e.key==='ArrowRight')switchVariant(1);if(e.key==='Escape'&&mapOpen)closeMap()}); render();
    </script>
